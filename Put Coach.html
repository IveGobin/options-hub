<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="hub_shared.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Put Coach</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0f0e0c;
    --surface: #1a1916;
    --surface2: #242220;
    --border: #3e3b35;
    --text: #ede8e0;
    --muted: #a09890;
    --accent: #e8753a;
    --safe: #3aad72;
    --warn: #e8a03a;
    --danger: #e86060;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
}
[data-theme="light"] {
    --bg: #f2f0eb;
    --surface: #ffffff;
    --surface2: #eeebe6;
    --border: #ccc9c2;
    --text: #1a1814;
    --muted: #5a5650;
    --accent: #c8521a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 28px 16px 48px;
    transition: background .3s, color .3s;
}
.shell { width: 100%; max-width: 520px; }

/* Card */
.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 26px 24px 28px;
    box-shadow: 0 8px 40px rgba(0,0,0,.28);
}

/* Header */
.hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.hdr-left { display: flex; flex-direction: column; gap: 2px; }
.eyebrow { font-family: var(--mono); font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.title { font-family: var(--mono); font-size: 19px; font-weight: 700; }
.btn-sm {
    font-family: var(--mono); font-size: 10px; padding: 5px 11px;
    border-radius: 7px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--muted);
    cursor: pointer; transition: all .2s; letter-spacing: .06em;
}
.btn-sm:hover { border-color: var(--accent); color: var(--accent); }

/* Mode pills */
.mode-row { display: flex; gap: 6px; margin-bottom: 20px; }
.mode-pill {
    flex: 1; padding: 9px 4px;
    border-radius: 9px; border: 1.5px solid var(--border);
    background: var(--surface2); color: var(--muted);
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    letter-spacing: .05em; text-transform: uppercase;
    cursor: pointer; transition: all .2s; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.mode-pill small { font-size: 9px; font-family: var(--sans); font-weight: 400; letter-spacing: 0; opacity: .7; }
.mode-pill.sel-c { border-color: var(--accent); color: var(--accent); background: rgba(232,117,58,.08); }
.mode-pill.sel-c small { opacity: 1; }
.mode-pill.sel-m { border-color: var(--safe); color: var(--safe); background: rgba(58,173,114,.08); }
.mode-pill.sel-m small { opacity: 1; }
.mode-pill.sel-a { border-color: var(--warn); color: var(--warn); background: rgba(232,160,58,.08); }
.mode-pill.sel-a small { opacity: 1; }

/* Net liq input — big and prominent */
.nlv-wrap { margin-bottom: 20px; }
.nlv-label { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: block; }
.nlv-input-row { display: flex; align-items: center; gap: 10px; }
.nlv-input {
    flex: 1; padding: 13px 16px;
    border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--surface2); color: var(--text);
    font-size: 22px; font-family: var(--mono); font-weight: 700;
    outline: none; transition: border-color .2s, box-shadow .2s;
    -moz-appearance: textfield;
}
.nlv-input::-webkit-outer-spin-button,
.nlv-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.nlv-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,117,58,.1); }
.nlv-input::placeholder { color: var(--muted); font-size: 15px; font-weight: 400; }

/* VIX row */
.vix-row { margin-bottom: 20px; }
.vix-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.vix-val { font-family: var(--mono); font-size: 16px; font-weight: 700; transition: color .3s; }
.vix-tag { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .08em; padding: 2px 7px; border-radius: 20px; }
.vt-calm   { background: rgba(58,173,114,.15); color: #3aad72; }
.vt-tense  { background: rgba(232,160,58,.15); color: #e8a03a; }
.vt-fear   { background: rgba(232,96,96,.15);  color: #e86060; }
input[type="range"] {
    -webkit-appearance: none; width: 100%; height: 4px;
    border-radius: 2px; background: var(--border); outline: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--surface);
    box-shadow: 0 0 0 2px var(--accent); cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--surface); cursor: pointer;
}
.vix-scale { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 9px; color: var(--muted); margin-top: 3px; }

/* Divider */
.div { height: 1px; background: var(--border); margin: 18px 0; }

/* Radar chart */
.radar-wrap {
    position: relative; margin: 4px auto 0;
    width: 100%; max-width: 340px;
}
.radar-wrap svg { width: 100%; height: auto; display: block; }
.radar-legend {
    display: flex; gap: 18px; justify-content: center;
    margin-top: 10px; flex-wrap: wrap;
}
.radar-leg-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-family: var(--mono); color: var(--muted); }
.radar-leg-dot { width: 10px; height: 3px; border-radius: 2px; flex-shrink: 0; }


/* Position sliders */
.sliders-wrap { margin-top: 20px; }
.slider-field { margin-bottom: 16px; }
.slider-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.slider-label { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.slider-val { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--text); transition: color .3s; }

/* You-are-here status */
.you-status {
    border-radius: 11px; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    margin-top: 18px;
    background: var(--surface2); border: 1.5px solid var(--border);
    transition: all .3s;
}
.you-status.safe   { border-color: #3aad72; background: rgba(58,173,114,.06); }
.you-status.warn   { border-color: #e8a03a; background: rgba(232,160,58,.06); }
.you-status.danger { border-color: #e86060; background: rgba(232,96,96,.06); }
.you-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex-shrink: 0; transition: all .3s; }
.you-status.safe   .you-dot { background: #3aad72; box-shadow: 0 0 0 3px rgba(58,173,114,.2); }
.you-status.warn   .you-dot { background: #e8a03a; box-shadow: 0 0 0 3px rgba(232,160,58,.2); }
.you-status.danger .you-dot { background: #e86060; box-shadow: 0 0 0 3px rgba(232,96,96,.2); }
.you-text { flex: 1; }
.you-headline { font-size: 15px; font-weight: 600; }
.you-status.safe   .you-headline { color: #3aad72; }
.you-status.warn   .you-headline { color: #e8a03a; }
.you-status.danger .you-headline { color: #e86060; }
.you-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 2px; }

/* Currency toggle */
.cur-toggle {
    display: flex; border-radius: 6px; overflow: hidden;
    border: 1px solid var(--border); flex-shrink: 0;
}
.cur-btn {
    padding: 2px 7px; font-family: var(--mono); font-size: 9px;
    font-weight: 700; letter-spacing: .06em; border: none;
    background: var(--surface2); color: var(--muted);
    cursor: pointer; transition: all .15s;
}
.cur-btn.active { background: var(--accent); color: #fff; }

/* Max assignment loan: three choices */
.loan-row { display: flex; gap: 8px; }
.loan-btn {
    flex: 1; padding: 8px 4px; border-radius: 9px; border: 1.5px solid var(--border);
    background: var(--surface2); color: var(--muted);
    font-family: var(--mono); font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all .2s; text-align: center;
}
.loan-btn small { display: block; font-size: 9px; font-weight: 400; opacity: .7; margin-top: 1px; }
.loan-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(232,117,58,.08); }
.loan-btn.active small { opacity: 1; }

.empty-state { text-align: center; padding: 28px 0; color: var(--muted); font-family: var(--mono); font-size: 12px; }

/* Axis legend table */
.ax-row {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    gap: 0 10px;
    align-items: center;
    padding: 7px 10px;
    border-radius: 8px;
    margin-bottom: 4px;
    background: var(--surface2);
    border: 1px solid var(--border);
}
.ax-row:last-child { margin-bottom: 0; }
.ax-name { font-family: var(--mono); font-size: 9px; letter-spacing:.08em; text-transform:uppercase; color: var(--muted); }
.ax-val  { font-family: var(--mono); font-size: 12px; font-weight: 700; text-align:right; min-width: 52px; }
.ax-opt  { font-family: var(--mono); font-size: 9px; color: var(--muted); text-align:right; min-width: 52px; }
.ax-bar-wrap { grid-column: 1 / -1; height: 4px; background: var(--border); border-radius: 2px; margin-top: 3px; position:relative; overflow:visible; }
.ax-bar-fill { height: 100%; border-radius: 2px; transition: width .4s ease; -webkit-transition: width .4s ease; -webkit-transform: translateZ(0); transform: translateZ(0); will-change: width; }
.ax-bar-tgt  { position:absolute; top:-2px; width:2px; height:8px; border-radius:1px; background: rgba(58,173,114,0.7); }
.ax-zones    { grid-column: 1 / -1; display:flex; gap:4px; margin-top:4px; flex-wrap:wrap; }
.ax-zone-pill { font-family:var(--mono); font-size:8px; padding: 1px 6px; border-radius:10px; white-space:nowrap; }

/* +/- adjustment buttons */
.adj-btn { flex-shrink:0; width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:16px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:var(--mono); transition:background .15s; user-select:none; -webkit-user-select:none; }
.adj-btn:hover { background:var(--border); }
.adj-btn:active { transform:scale(0.93); }

/* Sell section */
.sell-card { background:var(--surface2); border:0.5px solid var(--border); border-radius:10px; padding:14px; margin-bottom:8px; }
.sell-headline { font-family:var(--mono); font-size:20px; font-weight:700; margin-bottom:3px; }
.sell-sub { font-family:var(--mono); font-size:10px; color:var(--muted); line-height:1.6; }
.sell-constraint { font-family:var(--mono); font-size:8px; letter-spacing:.08em; text-transform:uppercase; color:#e8a03a; margin-top:8px; }
.sell-rule { display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-top:0.5px solid var(--border); }
.sell-rule:first-child { border-top:none; padding-top:0; }
.sell-rule-icon { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:12px; }
.sell-rule-text { font-family:var(--mono); font-size:10px; color:var(--text); line-height:1.5; }
.sell-rule-text .sell-rule-sub { color:var(--muted); font-size:9px; display:block; margin-top:1px; }
.sell-tag { display:inline-block; font-family:var(--mono); font-size:9px; padding:2px 7px; border-radius:10px; margin:3px 3px 0 0; }
.sell-tag-r { background:rgba(232,96,96,0.12); color:#e86060; }
.sell-tag-o { background:rgba(232,160,58,0.12); color:#e8a03a; }
.sell-tag-g { background:rgba(58,173,114,0.12); color:#3aad72; }
.sell-meter-row { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
.sell-meter-label { font-family:var(--mono); font-size:9px; color:var(--muted); width:80px; flex-shrink:0; }
.sell-meter-bar { flex:1; height:5px; background:var(--border); border-radius:3px; overflow:hidden; }
.sell-meter-fill { height:100%; border-radius:3px; }
.sell-meter-val { font-family:var(--mono); font-size:9px; font-weight:700; width:96px; text-align:right; white-space:nowrap; }

/* Number inputs (stock holdings, loan target, what-if) */
.num-in { width:100%; font-family:var(--mono); font-size:14px; font-weight:700; padding:7px 10px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface2); color:var(--text); outline:none; -moz-appearance:textfield; appearance:textfield; box-sizing:border-box; }
.num-in::-webkit-outer-spin-button, .num-in::-webkit-inner-spin-button { -webkit-appearance:none; }
.num-in:focus { border-color:var(--accent); }

/* Leverage card: exposure if every short put is assigned */
.lev-card { border-radius:11px; padding:14px 16px; background:var(--surface2); border:1.5px solid var(--border); }
.lev-card.safe   { border-color:#3aad72; }
.lev-card.warn   { border-color:#e8a03a; }
.lev-card.danger { border-color:#e86060; }
.lev-top { display:flex; justify-content:space-between; align-items:flex-end; gap:10px; flex-wrap:wrap; }
.lev-big { font-family:var(--mono); font-size:28px; font-weight:700; line-height:1; }
.lev-cap { font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:5px; }
.lev-loan { font-family:var(--mono); font-size:12px; text-align:right; }
.lev-bar { position:relative; height:10px; border-radius:5px; background:var(--border); margin:22px 0 20px; }
.lev-fill { position:absolute; left:0; top:0; bottom:0; border-radius:5px; transition:width .3s; }
.lev-wi { position:absolute; top:0; bottom:0; border-radius:0 5px 5px 0; opacity:.45; }
.lev-mark { position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--text); opacity:.55; }
.lev-mark span { position:absolute; top:16px; transform:translateX(-50%); font-family:var(--mono); font-size:8.5px; color:var(--muted); white-space:nowrap; }
.lev-grid { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-family:var(--mono); font-size:11px; }
.lev-grid > span:nth-child(odd) { color:var(--muted); }
.lev-grid > span:nth-child(even) { text-align:right; }
/* What-if card (mobile first: 2 x 2 inputs, results as rows) */
.wi-card { margin-top:12px; padding:12px 14px 14px; border-radius:11px; background:var(--surface2); border:1px solid var(--border); }
.wi-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
.wi-usd { font-size:9px; padding:1px 6px; border-radius:10px; background:rgba(232,117,58,.15); color:var(--accent); margin-left:4px; letter-spacing:.06em; }
.wi-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; }
.wi-f { display:flex; flex-direction:column; gap:4px; min-width:0; }
.wi-f > span { font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
.wi-f > span i { font-style:normal; text-transform:none; letter-spacing:0; opacity:.6; }
.wi-f .num-in { font-size:16px; padding:9px 10px; min-height:42px; background:var(--surface); }   /* 16px: no iOS zoom */
.wi-f input[type=date] { -webkit-appearance:none; appearance:none; font-size:13px; padding:9px 6px 9px 8px; }   /* native picker: no zoom */
[data-theme="dark"] .wi-f input[type=date] { color-scheme:dark; }
.wi-res { margin-top:12px; }
.wi-hint { font-family:var(--mono); font-size:10.5px; color:var(--muted); line-height:1.6; }
.wi-verdict { font-family:var(--mono); font-size:12px; font-weight:700; padding:9px 11px; border-radius:8px; margin-bottom:10px; line-height:1.45; }
.wi-verdict small { display:block; font-weight:400; font-size:10px; opacity:.85; margin-top:2px; }
.wi-verdict.ok  { background:rgba(58,173,114,.12); color:#3aad72; }
.wi-verdict.bad { background:rgba(232,96,96,.12); color:#e86060; }
.wi-rows { display:grid; grid-template-columns:auto 1fr; gap:7px 12px; font-family:var(--mono); font-size:11.5px; align-items:baseline; }
.wi-rows > span:nth-child(odd) { color:var(--muted); font-size:10px; letter-spacing:.06em; text-transform:uppercase; }
.wi-rows > span:nth-child(even) { text-align:right; font-weight:700; }
.wi-rows .from { color:var(--muted); font-weight:400; }

/* Phones: use the full width (thin page gutter, lighter card padding) */
@media (max-width: 560px) {
    body { padding: 8px 6px 32px; }
    .card { padding: 16px 12px 20px; border-radius: 14px; box-shadow: none; }
    .ax-row { grid-template-columns: 1fr auto; padding: 8px 10px; }
    .ax-opt { grid-column: 1 / -1; text-align: left; margin-top: 1px; }
    .lev-card, .wi-card { padding-left: 12px; padding-right: 12px; }
}
</style>
</head>
<body data-theme="dark">
<div class="shell">
<div class="card">

    <!-- Header -->
    <div class="hdr">
        <div class="hdr-left">
            <span class="eyebrow">Risk manager</span>
            <span class="title">Put Coach <span class="ver" style="opacity:0.45;font-size:0.6em;font-weight:400;margin-left:6px">v1.10</span></span>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
            <label class="btn-sm" for="ibkr-file" style="cursor:pointer;" title="Import IBKR Activity Statement CSV (možeš odabrati više fajlova)">📂 Import</label>
            <input type="file" id="ibkr-file" accept=".csv" multiple style="display:none;" onchange="importIBKR(this)">
            <button class="btn-sm" onclick="toggleTheme()">Theme</button>
        </div>
    </div>

    <!-- Import status banner -->
    <div id="import-banner" style="display:none;align-items:center;gap:10px;padding:9px 14px;border-radius:9px;margin-bottom:14px;font-size:12px;background:rgba(58,173,114,0.08);border:1px solid rgba(58,173,114,0.25);">
        <span style="font-size:16px;">✅</span>
        <div style="flex:1;font-family:var(--mono);font-size:11px;color:var(--muted);" id="import-msg">—</div>
        <button onclick="clearImport()" style="border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 4px;">✕</button>
    </div>

    <!-- Mode -->
    <div class="mode-row">
        <button class="mode-pill" id="mp-conservative" onclick="setMode('conservative')">🛡️ Conservative<br><small>Stop 40% · loan 30%</small></button>
        <button class="mode-pill sel-m" id="mp-moderate"     onclick="setMode('moderate')">⚖️ Moderate<br><small>Stop 30% · loan 60%</small></button>
        <button class="mode-pill" id="mp-aggressive"   onclick="setMode('aggressive')">🔥 Aggressive<br><small>Stop 20% · loan 90%</small></button>
    </div>

    <!-- VIX slider -->
    <div class="vix-row">
        <div class="vix-header">
            <span class="vix-label" style="font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);">VIX</span>
            <div style="display:flex;align-items:center;gap:8px;">
                <span class="vix-val" id="vix-val">18</span>
                <span class="vix-tag vt-calm" id="vix-tag">Calm</span>
            </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
            <button class="adj-btn" onclick="adjustSlider('vix-slider','-0.5',onVix)">−</button>
            <input type="range" id="vix-slider" min="5" max="60" step="0.5" value="18" oninput="onVix()" style="flex:1;">
            <button class="adj-btn" onclick="adjustSlider('vix-slider','0.5',onVix)">+</button>
        </div>
        <div class="vix-scale">
            <span>5</span>
            <span style="color:#3aad72">20 calm</span>
            <span style="color:#e8a03a">30 tense</span>
            <span>60</span>
        </div>
    </div>

    <!-- Position sliders -->
    <div class="sliders-wrap">
        <div class="slider-field">
            <div class="slider-header">
                <div style="display:flex;align-items:center;gap:8px;">
                    <span class="slider-label" title="Excess Liquidity from TWS / Client Portal (Account window). Not in the Activity Statement, so the import never changes it.">Excess liquidity (TWS)</span>
                    <div class="cur-toggle" id="exc-cur-toggle">
                        <button class="cur-btn active" onclick="setCur('exc','EUR')">EUR</button>
                        <button class="cur-btn" onclick="setCur('exc','USD')">USD</button>
                    </div>
                </div>
                <span class="slider-val" id="exc-val">—</span>
            </div>
            <input class="num-in" type="number" id="exc-in" min="0" step="100" value="0" oninput="onSliders()">
            <div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px;" id="exc-converted"></div>
        </div>
        <div class="slider-field">
            <div class="slider-header">
                <div style="display:flex;align-items:center;gap:8px;">
                    <span class="slider-label">Put notional sold</span>
                    <div class="cur-toggle" id="not-cur-toggle">
                        <button class="cur-btn" onclick="setCur('not','EUR')">EUR</button>
                        <button class="cur-btn active" onclick="setCur('not','USD')">USD</button>
                    </div>
                </div>
                <span class="slider-val" id="not-val">—</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
                <button class="adj-btn" onclick="adjustSlider('not-slider','-500',onSliders)">−</button>
                <input type="range" id="not-slider" min="0" step="500" oninput="onSliders()" style="flex:1;">
                <button class="adj-btn" onclick="adjustSlider('not-slider','500',onSliders)">+</button>
            </div>
            <div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px;" id="not-converted"></div>
        </div>
        <div class="slider-field">
            <div class="slider-header">
                <div style="display:flex;align-items:center;gap:8px;">
                    <span class="slider-label" title="Market value of the stocks you hold. They already use part of your NLV, so they count toward exposure.">Stock holdings</span>
                    <div class="cur-toggle" id="stk-cur-toggle">
                        <button class="cur-btn active" onclick="setCur('stk','EUR')">EUR</button>
                        <button class="cur-btn" onclick="setCur('stk','USD')">USD</button>
                    </div>
                </div>
                <span style="font-family:var(--mono);font-size:10px;color:var(--muted);" id="stk-converted"></span>
            </div>
            <input class="num-in" type="number" id="stk-val" min="0" step="1000" value="0" oninput="onSliders()">
        </div>
        <div class="slider-field">
            <div class="slider-header">
                <span class="slider-label" title="How much margin loan (as % of NLV) you accept in the worst case: every short put assigned at once. Max exposure = NLV × (1 + loan %).">Max assignment loan</span>
                <span style="font-family:var(--mono);font-size:10px;color:var(--muted);" id="loan-hint"></span>
            </div>
            <input type="hidden" id="loan-pct" value="60">
            <div class="loan-row">
                <button class="loan-btn" id="loan-30" onclick="setLoan(30)">30%<small>1.3x</small></button>
                <button class="loan-btn active" id="loan-60" onclick="setLoan(60)">60%<small>1.6x</small></button>
                <button class="loan-btn" id="loan-90" onclick="setLoan(90)">90%<small>1.9x</small></button>
            </div>
        </div>
    </div>

    <!-- Net liq + FX rate -->
    <div class="nlv-wrap">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
            <label class="nlv-label" for="nlv" style="margin-bottom:0;">Net liquidation value</label>
            <div style="display:flex; align-items:center; gap:8px;">
                <span style="font-family:var(--mono);font-size:9px;color:var(--muted);">EUR/USD</span>
                <input type="number" id="fx-rate" min="0.5" max="2" step="0.001" value="1.17"
                       oninput="render()"
                       style="font-family:var(--mono);font-size:12px;font-weight:700;padding:4px 8px;width:66px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);outline:none;-moz-appearance:textfield;text-align:center;">
                <span id="fx-date" style="font-family:var(--mono);font-size:9px;color:var(--muted);"></span>
                <div class="cur-toggle" id="nlv-cur-toggle">
                    <button class="cur-btn active" onclick="setCur('nlv','EUR')">EUR</button>
                    <button class="cur-btn" onclick="setCur('nlv','USD')">USD</button>
                </div>
            </div>
        </div>
        <input class="nlv-input" type="number" id="nlv" min="0" step="1000"
               placeholder="e.g. 100 000" oninput="render()" style="width:100%;">
        <div id="nlv-converted" style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:5px;display:none;"></div>
    </div>

    <!-- Radar chart -->
    <div id="table-section" style="display:none;">
        <div class="div" style="margin-top:0;"></div>

        <!-- Leverage if every short put is assigned -->
        <div class="lev-card" id="lev-card"></div>

        <!-- What-if: one new put trade (US options, USD) -->
        <div class="wi-card">
            <div class="wi-head">
                <span class="slider-label">What-if · new short put <span class="wi-usd">USD</span></span>
                <button class="btn-sm" onclick="clearWhatIf()">Clear</button>
            </div>
            <div class="wi-grid">
                <label class="wi-f"><span>Contracts</span>
                    <input class="num-in" type="number" id="wi-qty" min="0" step="1" inputmode="numeric" placeholder="e.g. 2" oninput="onSliders()"></label>
                <label class="wi-f"><span>Strike $</span>
                    <input class="num-in" type="number" id="wi-strike" min="0" step="0.5" inputmode="decimal" placeholder="e.g. 20" oninput="onSliders()"></label>
                <label class="wi-f"><span>Ticker <i>optional</i></span>
                    <input class="num-in" type="text" id="wi-tkr" maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="new ticker" oninput="this.value=this.value.toUpperCase();onSliders()" style="text-transform:uppercase;"></label>
                <label class="wi-f"><span>Expiry <i>optional</i></span>
                    <input class="num-in" type="date" id="wi-exp" oninput="onSliders()"></label>
            </div>
            <div class="wi-res" id="wi-res"></div>
        </div>
        <div class="div"></div>

        <div class="radar-wrap">
            <svg id="radar-svg" viewBox="0 0 390 390" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:100%;"></svg>
            <div class="radar-legend">
                <div class="radar-leg-item"><div class="radar-leg-dot" style="background:#4a9d6e;opacity:.5;height:8px;width:8px;border-radius:50%;"></div>Target zone</div>
                <div class="radar-leg-item"><div class="radar-leg-dot" style="background:#e8753a;height:2px;width:12px;"></div>Your position</div>
            </div>
        </div>


        <!-- Axis legend table -->
        <div id="axis-legend" style="margin-top:14px;">
            <button onclick="toggleAxes()" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:10px;border:0.5px solid var(--border);background:var(--surface2);cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;">
                <span>Axis breakdown</span>
                <span id="axis-arrow" style="font-size:14px;">▸</span>
            </button>
            <div id="axis-rows" style="display:none;margin-top:8px;"></div>
        </div>

        <!-- Put book risk (moneyness proxy + DTE) -->
        <div id="book-risk" style="margin-top:16px;display:none;"></div>

        <!-- Status -->
        <div class="you-status" id="you-status">
            <div class="you-dot"></div>
            <div class="you-text">
                <div class="you-headline" id="you-headline">Move the sliders above</div>
                <div class="you-sub" id="you-sub">to see where you stand</div>
            </div>
        </div>

        <!-- What can I sell -->
        <div id="sell-section" style="margin-top:14px;display:none;">
            <button id="sell-toggle" onclick="toggleSell()" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:10px;border:0.5px solid var(--border);background:var(--surface2);cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;">
                <span>What can I sell today?</span>
                <span id="sell-arrow" style="font-size:14px;transition:transform .2s;">▸</span>
            </button>
            <div id="sell-body" style="display:none;margin-top:8px;">
                <div id="sell-content"></div>
            </div>
        </div>
    </div>

    <div id="empty-state" class="empty-state">Enter your net liq value above</div>

</div>
</div>

<script>
    const MODES = {
        conservative: { hardStop: 40, vixBase: 50, vixSlope: 0.50, vixCap: 70 },
        moderate:     { hardStop: 30, vixBase: 40, vixSlope: 0.75, vixCap: 60 },
        aggressive:   { hardStop: 20, vixBase: 30, vixSlope: 0.50, vixCap: 45 },
    };
    // Exposure limit = max margin loan you accept if EVERY short put is assigned (worst case), as % of NLV.
    // Total exposure = stock holdings + raw put notional. Green ≤ NLV × (1 + loan%),
    // warn up to LOAN_WARN_BAND percentage points above that, danger beyond.
    const LOAN_OPTIONS = [30, 60, 90];
    const LOAN_DEFAULT = { conservative: 30, moderate: 60, aggressive: 90 };
    const LOAN_WARN_BAND = 25;
    const MARGIN = 0.20;          // approx. margin a NEW short put uses, per EUR notional
    // Margin cushion = excess / (stocks + put notional): the uniform drop of every underlying
    // (delta 1, worst case) that would use up today's excess liquidity → margin call.
    // TWS excess already has the current margin deducted, so no margin is subtracted again.
    const CUSHION_GREEN = 0.20;   // survives a ≥ 20% drop
    const CUSHION_WARN  = 0.10;   // < 10% drop = danger
    // "13%", or "100%+" when even a total loss would not use up the excess
    function fmtCushion(c) { return !isFinite(c) ? '—' : c >= 1 ? '100%+' : Math.round(c * 100) + '%'; }

    let currentMode = 'moderate';
    // Currency selections: 'EUR' or 'USD' for each field
    var curNLV = 'EUR';
    var curExc = 'EUR';
    var curNot = 'USD';
    var curStk = 'EUR';

    // Concentration data parsed from IBKR CSV (short puts, USD notional per ticker / expiry)
    var gTickerMap  = {};
    var gDateMap    = {};
    var gNotionalUSD = 0;
    var gStocks     = [];   // stocks held: { ticker, ccy, value (local ccy), etf }
    var gPositions  = [];   // short puts from the statement, each with risk weight/status
    var gRiskAvg    = null; // notional-weighted average risk weight (0.1 .. 1)
    var gStmtDate   = 0;    // statement date used as "today" for DTE

    const FX_DEFAULT = 1.17;   // same as the fx-rate field's default value
    function getFX() { return parseFloat(el('fx-rate').value) || FX_DEFAULT; }

    function adjustSlider(id, delta, callback) {
        var s = el(id);
        var newVal = parseFloat(s.value) + parseFloat(delta);
        newVal = Math.max(parseFloat(s.min), Math.min(parseFloat(s.max), newVal));
        s.value = newVal;
        callback();
    }

    // Convert input value to EUR for calculations
    function toEUR(val, cur) {
        return cur === 'USD' ? val / getFX() : val;
    }
    // Convert EUR amount to display currency
    function fromEUR(val, cur) {
        return cur === 'USD' ? val * getFX() : val;
    }

    // Switch a field's currency. The amount is converted so its value stays the same
    // (26 000 EUR → 30 420 USD), unless keepValue is set (import writes the value in the new currency).
    var CUR_INPUT = { nlv: 'nlv', exc: 'exc-in', not: 'not-slider', stk: 'stk-val' };
    function setCur(field, cur, keepValue) {
        var prev = field === 'nlv' ? curNLV : field === 'exc' ? curExc : field === 'not' ? curNot : curStk;
        if (field === 'nlv') curNLV = cur;
        if (field === 'exc') curExc = cur;
        if (field === 'not') curNot = cur;
        if (field === 'stk') curStk = cur;

        var inp = el(CUR_INPUT[field]);
        var v = parseFloat(inp.value);
        if (!keepValue && prev !== cur && !isNaN(v) && v > 0) {
            var nv = Math.round(prev === 'EUR' ? v * getFX() : v / getFX());
            if (inp.type === 'range') inp.max = Math.max(parseFloat(inp.max) || 0, nv);   // avoid clamping
            inp.value = nv;
        }

        // Update toggle button states
        var toggle = el(field + '-cur-toggle');
        toggle.querySelectorAll('.cur-btn').forEach(function(btn) {
            btn.classList.toggle('active', btn.textContent === cur);
        });

        // Update slider ranges and redraw
        render();
    }

    function el(id) { return document.getElementById(id); }
    function fmt(n) {
        if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
        if (n >= 1e3) return (n % 1000 === 0 ? (n/1e3).toFixed(0) : (n/1e3).toFixed(1)) + 'k';
        return n.toFixed(0);
    }

    function toggleTheme() {
        var t = document.body.getAttribute('data-theme');
        document.body.setAttribute('data-theme', t === 'dark' ? 'light' : 'dark');
        render();   // the radar SVG takes its colours from the theme
    }

    function setMode(m) {
        currentMode = m;
        ['conservative','moderate','aggressive'].forEach(function(x) {
            var cls = 'mode-pill' + (x === m ? (' sel-' + x[0]) : '');
            el('mp-' + x).className = cls;
        });
        setLoan(LOAN_DEFAULT[m]);   // each mode brings its own loan target (can be changed after)
    }

    // Max assignment loan: one of LOAN_OPTIONS, picked with the three buttons
    function setLoan(v) {
        el('loan-pct').value = v;
        LOAN_OPTIONS.forEach(function(o) {
            el('loan-' + o).className = 'loan-btn' + (o === v ? ' active' : '');
        });
        render();
    }

    function onVix() {
        var v = parseFloat(el('vix-slider').value);
        el('vix-val').textContent = v % 1 === 0 ? v : v.toFixed(1);
        var tag = el('vix-tag');
        if (v < 20)      { el('vix-val').style.color = '#3aad72'; tag.textContent = 'Calm';  tag.className = 'vix-tag vt-calm'; }
        else if (v < 30) { el('vix-val').style.color = '#e8a03a'; tag.textContent = 'Tense'; tag.className = 'vix-tag vt-tense'; }
        else             { el('vix-val').style.color = '#e86060'; tag.textContent = 'Fear';  tag.className = 'vix-tag vt-fear'; }
        render();
    }

    function getLoanPct() {
        var v = parseFloat(el('loan-pct').value);
        return isNaN(v) || v < 0 ? 0 : v;
    }

    // What-if trade: contracts × 100 × strike, in USD (0 when incomplete)
    function whatIfUSD() {
        var q = parseFloat(el('wi-qty').value), k = parseFloat(el('wi-strike').value);
        return (q > 0 && k > 0) ? q * 100 * k : 0;
    }

    var MON3 = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    // What-if expiry (yyyy-mm-dd) → IBKR key "18DEC26" (empty = none)
    function whatIfDateKey() {
        var v = el('wi-exp').value;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return '';
        return v.slice(8, 10) + MON3[parseInt(v.slice(5, 7), 10) - 1] + v.slice(2, 4);
    }

    // Concentration of the book incl. stocks held and the what-if trade.
    //   ticker: (stock value + put notional on the ticker) / (all stocks + all put notional)
    //           ETFs count in the total but never as one ticker (already diversified)
    //   date:   put notional per expiry / all put notional
    // A what-if without ticker / expiry counts as a new ticker / expiry.
    function concNow(wiUSD, wiTicker, wiDate) {
        var fx = getFX(), tmap = {}, dmap = {}, putTot = gNotionalUSD, stkTot = 0;
        Object.keys(gTickerMap).forEach(function(k) { tmap[k] = gTickerMap[k]; });
        Object.keys(gDateMap).forEach(function(k) { dmap[k] = gDateMap[k]; });
        gStocks.forEach(function(s) {
            var v = s.ccy === 'USD' ? s.value : s.ccy === 'EUR' ? s.value * fx : 0;   // other ccys: not converted, skipped
            if (!(v > 0)) return;
            stkTot += v;
            if (!s.etf) tmap[s.ticker] = (tmap[s.ticker] || 0) + v;
        });
        var hasBook = putTot > 0 || stkTot > 0;
        if (hasBook && wiUSD > 0) {
            putTot += wiUSD;
            if (wiTicker) tmap[wiTicker] = (tmap[wiTicker] || 0) + wiUSD;
            if (wiDate)   dmap[wiDate]   = (dmap[wiDate]   || 0) + wiUSD;
        }
        var top = function(m) {
            return Object.keys(m).reduce(function(a, k) { return a === null || m[k] > m[a] ? k : a; }, null);
        };
        var tt = top(tmap), td = top(dmap), tTot = putTot + stkTot;
        return {
            tmap: tmap, dmap: dmap, tTot: tTot, dTot: putTot, hasBook: hasBook,
            topTicker: tt, tickerConc: tt && tTot > 0 ? tmap[tt] / tTot : 0,
            topDate: td,   dateConc:   td && putTot > 0 ? dmap[td] / putTot : 0,
            share: function(t) { return tTot > 0 ? (tmap[t] || 0) / tTot : 0; },
            dshare: function(dk) { return putTot > 0 ? (dmap[dk] || 0) / putTot : 0; }
        };
    }

    // How much NEW put notional (EUR) fits before any limit turns non-green.
    // Every limit is linear in the added notional Δ (a new put uses MARGIN·Δ of excess):
    //   exposure:  totalExp + Δ ≤ maxTotal
    //   liquidity: excess − MARGIN·Δ ≥ targetExcess
    //   margin:    (excess − MARGIN·Δ) / (totalExp + Δ) ≥ CUSHION_GREEN
    // The status line, the sell card and the what-if "fits" all use this one function.
    function roomCalc(excess, totalExp, maxTotal, targetExcess) {
        var r = {
            exposure:  Math.max(0, maxTotal - totalExp),
            liquidity: Math.max(0, (excess - targetExcess) / MARGIN),
            margin:    Math.max(0, (excess - CUSHION_GREEN * totalExp) / (MARGIN + CUSHION_GREEN))
        };
        r.room = Math.min(r.exposure, r.liquidity, r.margin);
        r.binding = r.room === r.exposure ? 'exposure' : r.room === r.liquidity ? 'liquidity' : 'margin';
        return r;
    }
    function bindingLabel(r, d) {
        return r.binding === 'exposure' ? 'Loan target (' + d.loanPct + '% of NLV)'
             : r.binding === 'liquidity' ? 'Liquidity — excess target ' + Math.round(d.targetExcess / d.nlv * 100) + '% of NLV'
             : 'Margin — must survive a ' + Math.round(CUSHION_GREEN * 100) + '% drop';
    }

    function getTarget() {
        var vix = parseFloat(el('vix-slider').value);
        var cfg = MODES[currentMode];
        var t = cfg.vixBase + Math.max(0, vix - 15) * cfg.vixSlope;
        return Math.min(cfg.vixCap, t);
    }

    function render() {
        var nlvRaw = parseFloat(el('nlv').value);
        if (isNaN(nlvRaw) || nlvRaw <= 0) {
            el('table-section').style.display = 'none';
            el('empty-state').style.display = 'block';
            return;
        }
        el('table-section').style.display = 'block';
        el('empty-state').style.display = 'none';

        var nlvEUR = toEUR(nlvRaw, curNLV);

        // Show conversion hint under NLV
        var nlvConv = el('nlv-converted');
        if (curNLV === 'USD') {
            nlvConv.textContent = '≈ ' + fmt(nlvEUR) + ' EUR';
        } else {
            nlvConv.textContent = '';
        }

        var warnTotal = nlvEUR * (1 + (getLoanPct() + LOAN_WARN_BAND) / 100);

        // Put slider max in its currency (an import can raise it further). Never below the
        // current value, otherwise the browser silently clamps it when NLV / loan % change.
        var ns = el('not-slider');
        ns.max = Math.max(
            Math.round(fromEUR(warnTotal * 1.5, curNot)),
            gNotionalUSD > 0 ? Math.round(fromEUR(gNotionalUSD / getFX(), curNot) * 1.5) : 0,
            Math.ceil((parseFloat(ns.value) || 0) * 1.2));

        onSliders();
    }

    var AXES = ['Liquidity', 'Put Quality', 'Exposure', 'Margin Safety', 'Ticker Conc.', 'Date Conc.'];
    var N = AXES.length;
    var CX = 195, CY = 190, R = 128;

    function axisPoint(i, r) {
        var angle = (Math.PI * 2 * i / N) - Math.PI / 2;
        return { x: CX + r * Math.cos(angle), y: CY + r * Math.sin(angle) };
    }

    function polyPoints(values) {
        return values.map(function(v, i) {
            var p = axisPoint(i, v * R);
            return p.x.toFixed(1) + ',' + p.y.toFixed(1);
        }).join(' ');
    }

    function drawRadar(scores, targetScores, zone) {
        var isDark = document.body.getAttribute('data-theme') !== 'light';
        var axisColor  = isDark ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.15)';
        var labelColor = isDark ? '#c8c0b4' : '#5a5650';
        var zoneColor  = zone === 'safe' ? '#3aad72' : zone === 'warn' ? '#e8a03a' : '#e86060';
        var zoneAlpha  = zone === 'safe' ? '0.20' : zone === 'warn' ? '0.18' : '0.14';
        var bgColor    = isDark ? '#16221a' : '#e8f2ec';

        var svg = '';

        // ── Dark circle background ────────────────────────────────────────
        svg += '<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="'+bgColor+'" opacity="0.55"/>';

        // ── Circular grid rings ───────────────────────────────────────────
        var rings = [
            { r: 0.2, color: 'rgba(255,255,255,0.07)', w: '0.8' },
            { r: 0.4, color: 'rgba(232,96,96,0.35)',   w: '1.2', dash: '4,3' },
            { r: 0.6, color: 'rgba(255,255,255,0.07)', w: '0.8' },
            { r: 0.7, color: 'rgba(232,160,58,0.35)',  w: '1.2', dash: '4,3' },
            { r: 0.8, color: 'rgba(255,255,255,0.07)', w: '0.8' },
            { r: 1.0, color: 'rgba(58,173,114,0.30)',  w: '1.2' },
        ];
        rings.forEach(function(ring) {
            var attr = ' cx="'+CX+'" cy="'+CY+'" r="'+(ring.r*R).toFixed(1)+'" fill="none" stroke="'+ring.color+'" stroke-width="'+ring.w+'"';
            if (ring.dash) attr += ' stroke-dasharray="'+ring.dash+'"';
            svg += '<circle'+attr+'/>';
        });

        // ── % labels on rings (upper-right between top and right axis) ────
        [
            { r: 0.4, label: '40%', color: '#e86060' },
            { r: 0.7, label: '70%', color: '#e8a03a' },
            { r: 1.0, label: '100%', color: '#3aad72' },
        ].forEach(function(m) {
            // Place label at 45° angle (between top and right axes) outside the ring
            var angle = -Math.PI / 2 + Math.PI * 2 / N * 0.5; // halfway between axis 0 and 1
            var px = CX + m.r * R * Math.cos(angle);
            var py = CY + m.r * R * Math.sin(angle);
            svg += '<text x="'+(px+4).toFixed(1)+'" y="'+(py+4).toFixed(1)+'" font-family="Space Mono,monospace" font-size="8" fill="'+m.color+'" font-weight="700" opacity="0.85">'+m.label+'</text>';
        });

        // ── Axis lines ───────────────────────────────────────────────────
        for (var i = 0; i < N; i++) {
            var tip = axisPoint(i, R);
            svg += '<line x1="'+CX+'" y1="'+CY+'" x2="'+tip.x.toFixed(1)+'" y2="'+tip.y.toFixed(1)+'" stroke="'+axisColor+'" stroke-width="1"/>';
        }

        // ── Target polygon ───────────────────────────────────────────────
        svg += '<polygon points="'+polyPoints(targetScores)+'" fill="rgba(58,173,114,0.08)" stroke="rgba(58,173,114,0.45)" stroke-width="1.5" stroke-dasharray="5,3"/>';

        // ── Your position polygon ────────────────────────────────────────
        var fillRgb = zone==='safe' ? '58,173,114' : zone==='warn' ? '232,160,58' : '232,96,96';
        svg += '<polygon points="'+polyPoints(scores)+'" fill="rgba('+fillRgb+','+zoneAlpha+')" stroke="'+zoneColor+'" stroke-width="2.5" stroke-linejoin="round"/>';

        // ── Dots ─────────────────────────────────────────────────────────
        scores.forEach(function(v, i) {
            var p = axisPoint(i, v*R);
            svg += '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="5" fill="'+zoneColor+'" stroke="'+bgColor+'" stroke-width="2"/>';
        });

        // ── Axis labels ──────────────────────────────────────────────────
        AXES.forEach(function(label, i) {
            var p = axisPoint(i, R + 26);
            // For 6 axes: 0=top, 1=upper-right, 2=lower-right, 3=bottom, 4=lower-left, 5=upper-left
            var anchor = (i === 0 || i === 3) ? 'middle' : (i === 1 || i === 2) ? 'start' : 'end';
            var words = label.toUpperCase().split(' ');
            var line1 = words[0], line2 = words.slice(1).join(' ');
            var dy1 = line2 ? '-5' : '4';
            svg += '<text x="'+p.x.toFixed(1)+'" y="'+p.y.toFixed(1)+'" text-anchor="'+anchor+'" font-family="Space Mono,monospace" font-size="10" font-weight="700" fill="'+labelColor+'" letter-spacing="0.06em">'
                +'<tspan x="'+p.x.toFixed(1)+'" dy="'+dy1+'">'+line1+'</tspan>'
                +(line2 ? '<tspan x="'+p.x.toFixed(1)+'" dy="14">'+line2+'</tspan>' : '')
                +'</text>';
        });

        // ── Score pill near each dot ──────────────────────────────────────
        scores.forEach(function(v, i) {
            // Offset label away from center
            var offset = v > 0.12 ? -18 : 18;
            var p = axisPoint(i, v*R + offset);
            var pct = Math.round(v*100)+'%';
            var sc = v>=0.7 ? '58,173,114' : v>=0.4 ? '232,160,58' : '232,96,96';
            svg += '<rect x="'+(p.x-13).toFixed(1)+'" y="'+(p.y-7).toFixed(1)+'" width="26" height="14" rx="4" fill="rgba('+sc+',0.22)"/>';
            svg += '<text x="'+p.x.toFixed(1)+'" y="'+(p.y+4.5).toFixed(1)+'" text-anchor="middle" font-family="Space Mono,monospace" font-size="9.5" fill="rgb('+sc+')" font-weight="700">'+pct+'</text>';
        });

        el('radar-svg').innerHTML = svg;
    }

    function onSliders() {
        var nlvRaw = parseFloat(el('nlv').value);
        if (isNaN(nlvRaw) || nlvRaw <= 0) return;

        var excessRaw   = Math.max(0, parseFloat(el('exc-in').value) || 0);
        var notionalRaw = parseFloat(el('not-slider').value);

        var nlv      = toEUR(nlvRaw, curNLV);
        var excessIn = toEUR(excessRaw, curExc);                // today, from TWS
        var wiUSD    = whatIfUSD();
        var wiEUR    = wiUSD / getFX();
        var excess   = excessIn - wiEUR * MARGIN;               // after the what-if trade (it uses margin)
        var notional = toEUR(notionalRaw, curNot) + wiEUR;     // put notional incl. the what-if trade
        var stkRaw   = parseFloat(el('stk-val').value);
        var stocks   = isNaN(stkRaw) || stkRaw < 0 ? 0 : toEUR(stkRaw, curStk);
        el('stk-converted').textContent = stocks > 0 && curStk === 'USD' ? '≈ ' + fmt(stocks) + ' EUR' : '';

        // Display values with currency symbol
        el('exc-val').textContent = fmt(excessRaw) + ' ' + curExc;
        el('not-val').textContent = fmt(notionalRaw) + ' ' + curNot;

        // Show conversion hint
        // Excess liquidity can never exceed NLV in TWS: flag a likely typo
        var excConv = el('exc-converted');
        excConv.textContent = (curExc === 'USD' ? '≈ ' + fmt(excessIn) + ' EUR' : '') +
            (excessIn > nlv ? (curExc === 'USD' ? ' · ' : '') + '⚠️ above NLV — check the value from TWS' : '');
        excConv.style.color = excessIn > nlv ? '#e86060' : '';
        var notConv = el('not-converted');
        if (curNot === 'USD') {
            notConv.textContent = '≈ ' + fmt(notional - wiEUR) + ' EUR';
        } else {
            notConv.textContent = '';
        }

        var cfg    = MODES[currentMode];
        var target = getTarget();
        var vix    = parseFloat(el('vix-slider').value);
        var loanPct = getLoanPct();

        var stopExcess    = (cfg.hardStop / 100) * nlv;
        var targetExcess  = (target / 100) * nlv;

        // Exposure if every short put is assigned (worst case): stocks + RAW put notional.
        var totalExp  = stocks + notional;
        var maxTotal  = nlv * (1 + loanPct / 100);                     // green limit
        var warnTotal = nlv * (1 + (loanPct + LOAN_WARN_BAND) / 100);  // danger beyond this
        el('loan-hint').textContent = '= max ' + (1 + loanPct / 100).toFixed(2) + 'x NLV';

        // Risk-weighted put notional (info only): the imported book counts with factor 0.66..1.0
        // depending on moneyness/DTE (see putRisk); notional above the imported book counts fully.
        // The exposure limit and margin use the RAW notional.
        var csvEUR = gNotionalUSD > 0 ? gNotionalUSD / getFX() : 0;
        var riskFactor = (csvEUR > 0 && gRiskAvg !== null) ? (0.6 + 0.4 * gRiskAvg) : 1;
        var notionalEff = csvEUR > 0
            ? Math.min(notional, csvEUR) * riskFactor + Math.max(0, notional - csvEUR)
            : notional;

        // ── Compute 0..1 scores for each axis ───────────────────────────
        // Convention: score ≥ 0.70 = green, 0.40–0.70 = warn, < 0.40 = danger

        // 1. LIQUIDITY
        // Green: excess ≥ targetExcess, Warn: stopExcess–targetExcess, Danger: < stopExcess
        var liqScore;
        if (excess >= targetExcess) {
            // Grows from 0.70 at the target to 1.0 when the excess equals NLV (nothing on margin)
            liqScore = Math.min(1.0, 0.70 + ((excess - targetExcess) / Math.max(1, nlv - targetExcess)) * 0.30);
        } else if (excess >= stopExcess) {
            liqScore = 0.40 + ((excess - stopExcess) / (targetExcess - stopExcess)) * 0.30;
        } else {
            liqScore = Math.max(0, (excess / stopExcess) * 0.40);
        }

        // 2. PUT QUALITY — how the short puts are doing (moneyness proxy, see putQuality)
        // Notional-weighted average of q; losing puts weigh up to double. The what-if put is NOT
        // included: selling new puts must not improve the quality of the existing book.
        // VIX still drives the liquidity target (getTarget).
        var pq = bookQuality();
        var qualScore = pq.score;

        // 3. EXPOSURE SAFETY (stocks + puts, worst case all assigned)
        // Green: ≤ maxTotal, Warn: maxTotal–warnTotal, Danger: > warnTotal
        var expScore;
        if (totalExp <= 0) {
            expScore = 1.0;
        } else if (totalExp <= maxTotal) {
            expScore = 0.70 + (1 - totalExp / maxTotal) * 0.30;
        } else if (totalExp <= warnTotal) {
            expScore = 0.40 + ((warnTotal - totalExp) / (warnTotal - maxTotal)) * 0.30;
        } else {
            expScore = Math.max(0, 0.40 - ((totalExp - warnTotal) / warnTotal) * 0.40);
        }

        // 4. MARGIN SAFETY — stress test: market drop that wipes out today's excess
        // Green: cushion ≥ 20%, Warn: 10–20%, Danger: < 10%
        var marginUsed = notional * MARGIN;   // info (what-if text)
        var cushion = totalExp > 0 ? Math.max(0, excess) / totalExp : Infinity;
        var marginScore;
        if (cushion >= CUSHION_GREEN) {
            marginScore = Math.min(1.0, 0.70 + ((cushion - CUSHION_GREEN) / CUSHION_GREEN) * 0.30);
        } else if (cushion >= CUSHION_WARN) {
            marginScore = 0.40 + ((cushion - CUSHION_WARN) / (CUSHION_GREEN - CUSHION_WARN)) * 0.30;
        } else {
            marginScore = (cushion / CUSHION_WARN) * 0.40;
        }

        // 5. TICKER CONCENTRATION (stocks held + put notional per ticker, incl. the what-if)
        // Green: <40%, Warn: 40-60%, Danger: >60%
        // Blended toward 1.0 when the book is small vs. the loan limit (little real risk)
        var conc = concNow(wiUSD, el('wi-tkr').value.trim().toUpperCase(), whatIfDateKey());
        var tc = conc.tickerConc, dc = conc.dateConc;
        var tickerWeight = totalExp <= 0 ? 0 : maxTotal > 0 ? Math.min(1, totalExp / maxTotal) : 1;
        var rawTickerScore = tc <= 0.40
            ? 0.70 + (1 - tc / 0.40) * 0.30
            : Math.max(0, 0.70 - ((tc - 0.40) / 0.20) * 0.30);
        var tickerScore = rawTickerScore + (1.0 - rawTickerScore) * (1 - tickerWeight);

        // 6. DATE CONCENTRATION (put notional per expiry)
        // Green: <35%, Warn: 35-70%, Danger: >70%; blended by how much of the put room is used
        var putRoom = maxTotal - stocks;   // put notional that fits the limit next to the stocks
        var notionalWeight = notional <= 0 ? 0 : putRoom > 0 ? Math.min(1, notional / putRoom) : 1;
        var rawDateScore = dc <= 0.35
            ? 0.70 + (1 - dc / 0.35) * 0.30
            : dc <= 0.70
            ? 0.40 + ((0.70 - dc) / 0.35) * 0.30
            : Math.max(0, 0.40 - ((dc - 0.70) / 0.30) * 0.40);
        var dateScore = rawDateScore + (1.0 - rawDateScore) * (1 - notionalWeight);

        var scores = [liqScore, qualScore, expScore, marginScore, tickerScore, dateScore];

        // Target scores — the green zone boundary (0.70) on every axis
        var targetScores = [0.70, 0.70, 0.70, 0.70, 0.70, 0.70];

        // Zones. Overall zone = worst of liquidity, exposure and margin cushion.
        var liqZone = excess < stopExcess ? 'danger' : excess < targetExcess ? 'warn' : 'safe';
        var expZone = totalExp <= maxTotal ? 'safe' : totalExp <= warnTotal ? 'warn' : 'danger';
        var mrgZone = cushion >= CUSHION_GREEN ? 'safe' : cushion >= CUSHION_WARN ? 'warn' : 'danger';
        var zoneRank = { safe: 0, warn: 1, danger: 2 };
        // Without any position (stocks or puts) low excess is only a problem below the hard stop
        var effectiveLiq = totalExp > 0 ? liqZone : (excess < stopExcess ? 'danger' : 'safe');
        var zone = [effectiveLiq, expZone, mrgZone].reduce(function(a, z) { return zoneRank[z] > zoneRank[a] ? z : a; }, 'safe');

        // Colour input values
        el('exc-val').style.color = liqZone === 'danger' ? '#e86060' : liqZone === 'warn' ? '#e8a03a' : '#3aad72';
        el('not-val').style.color = expZone === 'danger' ? '#e86060' : expZone === 'warn' ? '#e8a03a' : '#3aad72';

        // Draw radar
        drawRadar(scores, targetScores, zone);

        var d = {
            nlv: nlv, excess: excess, excessIn: excessIn, notional: notional, notionalEff: notionalEff, vix: vix,
            stocks: stocks, wiEUR: wiEUR, wiUSD: wiUSD, totalExp: totalExp, loanPct: loanPct,
            stopExcess: stopExcess, targetExcess: targetExcess,
            maxTotal: maxTotal, warnTotal: warnTotal, expZone: expZone,
            marginUsed: marginUsed, cushion: cushion, conc: conc, pq: pq, scores: scores, targetScores: targetScores
        };
        // Room for new puts: after the what-if (status + sell card) and before it (what-if "fits")
        d.room       = roomCalc(excess, totalExp, maxTotal, targetExcess);
        d.roomBefore = roomCalc(excessIn, totalExp - wiEUR, maxTotal, targetExcess);
        renderLeverage(d);
        renderAxisLegend(d);
        renderSell(d);

        // Put book quality card (moneyness proxy + DTE)
        renderBookRisk(csvEUR, riskFactor);

        // Status message — the most severe problem first
        var status   = el('you-status');
        var headline = el('you-headline');
        var sub      = el('you-sub');
        var pctDrop  = fmtCushion(cushion);
        // Exposure to cut (closing puts also frees ~MARGIN of excess) to lift the cushion to c
        var cutForCushion = function(c) { return Math.max(0, (c * totalExp - excess) / (MARGIN + c)); };

        status.className = 'you-status ' + zone;

        // Active problems, most severe first: the first one is the headline, the rest follow as "Also"
        var needStop = stopExcess - excess, needTgt = targetExcess - excess;
        var issues = [];
        if (excess < stopExcess) issues.push({ h: '🔴 Reduce positions', n: 'below hard stop',
            s: 'Excess is ' + fmt(needStop) + ' EUR below the hard stop — close ~' + fmt(needStop / MARGIN) + ' EUR of put notional or add cash' });
        if (expZone === 'danger') issues.push({ h: '🔴 Overexposed', n: 'overexposed',
            s: 'Reduce exposure by ' + fmt(totalExp - warnTotal) + ' EUR (puts or stocks) to reach the caution zone' });
        if (mrgZone === 'danger') issues.push({ h: '🔴 Margin call risk', n: 'margin call risk (' + pctDrop + ' drop)',
            s: 'A ' + pctDrop + ' drop wipes out your excess — reduce exposure by ~' + fmt(cutForCushion(CUSHION_WARN)) + ' EUR' });
        if (effectiveLiq === 'warn') issues.push({ h: '⚠️ Hold — liquidity low', n: 'liquidity low',
            s: 'Excess is ' + fmt(needTgt) + ' EUR below target — close ~' + fmt(needTgt / MARGIN) + ' EUR of put notional or add cash to enter green' });
        if (expZone === 'warn') issues.push({ h: '⚠️ Caution — above loan target', n: 'above loan target',
            s: 'Reduce exposure by ' + fmt(totalExp - maxTotal) + ' EUR (puts or stocks) to get within ' + loanPct + '% loan' });
        if (mrgZone === 'warn') issues.push({ h: '⚠️ Caution — thin margin cushion', n: 'thin margin cushion (' + pctDrop + ' drop)',
            s: 'Survives a ' + pctDrop + ' drop (target ≥ ' + Math.round(CUSHION_GREEN * 100) + '%) — reduce exposure by ~' + fmt(cutForCushion(CUSHION_GREEN)) + ' EUR' });

        var subText;
        if (issues.length) {
            headline.textContent = issues[0].h;
            subText = issues[0].s;
            if (issues.length > 1) subText += ' · Also: ' + issues.slice(1).map(function(i) { return i.n; }).join(', ');
        } else if (d.room.room > 100) {
            headline.textContent = '✅ Free to sell';
            subText = 'Can add ~' + fmt(d.room.room) + ' EUR more put notional (binding: ' + bindingLabel(d.room, d) + ')';
        } else {
            headline.textContent = '✅ Green — at the limit';
            subText = 'Little room to add more at current levels';
        }

        // Imminent assignment: ITM puts expiring within 7 days (from today) are a loan that is coming
        var t0 = new Date(); t0.setHours(0, 0, 0, 0);
        var soonN = 0, soonUSD = 0;
        gPositions.forEach(function(p) {
            var days = Math.round((p.expiry - t0) / 86400000);
            if ((p.status === 'itm' || p.status === 'ditm') && days >= 0 && days <= 7) { soonN++; soonUSD += p.notional; }
        });
        if (soonN) subText += ' · ⏰ ' + soonN + ' ITM put' + (soonN > 1 ? 's' : '') + ' expire within 7 days (~$' + fmt(soonUSD) + ' assignment)';
        sub.textContent = subText;
    }

    // ── PUT BOOK RISK CARD ────────────────────────────────────────────────
    // Flag: near strike / likely ITM, or expiring within 7 days without being clearly deep OTM
    function isFlagged(p) {
        return p.status === 'near' || p.status === 'itm' || p.status === 'ditm' ||
               (p.dte <= 7 && (p.status === 'otm' || p.status === 'unknown'));
    }

    function renderBookRisk(csvEUR, riskFactor) {
        var box = el('book-risk');
        if (!gPositions.length || gNotionalUSD <= 0) { box.style.display = 'none'; box.innerHTML = ''; return; }
        box.style.display = 'block';

        var LBL = 'font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);';
        var stmt = gStmtDate ? new Date(gStmtDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : 'today';
        var total = gNotionalUSD;

        // notional share per status
        var order = ['deep', 'otm', 'near', 'itm', 'ditm', 'unknown'];
        var share = { deep: 0, otm: 0, near: 0, itm: 0, ditm: 0, unknown: 0 };
        gPositions.forEach(function(p) { share[p.status] += p.notional; });

        var bar = '', legend = '';
        order.forEach(function(k) {
            if (share[k] <= 0) return;
            var pct = share[k] / total * 100;
            bar += '<div style="width:' + pct.toFixed(2) + '%;background:' + RISK_COLOR[k] + ';height:100%;"></div>';
            legend += '<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px;">' +
                '<span style="width:8px;height:8px;border-radius:2px;background:' + RISK_COLOR[k] + ';display:inline-block;"></span>' +
                RISK_LABEL[k] + ' ' + Math.round(pct) + '%</span>';
        });

        var flagged = gPositions.filter(isFlagged).sort(function(a, b) {
            return (b.w * b.notional) - (a.w * a.notional);
        });
        var MAXROWS = 8;
        var rowsHTML = flagged.slice(0, MAXROWS).map(function(p) {
            var exp = p.expiry.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: '2-digit' });
            var px  = p.ratio !== null ? '\u00d7' + p.ratio.toFixed(1) + ' of premium' : 'no premium data';
            return '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-top:0.5px solid var(--border);">' +
                '<div style="min-width:0;">' +
                    '<div style="font-family:var(--mono);font-size:11px;font-weight:700;">' + escHTML(p.ticker) + ' ' + p.strike + ' P</div>' +
                    '<div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px;">' + exp + ' \u00b7 ' + p.dte + 'd \u00b7 ' + px + '</div>' +
                '</div>' +
                '<div style="text-align:right;flex-shrink:0;">' +
                    '<span style="font-family:var(--mono);font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;background:' + RISK_COLOR[p.status] + '26;color:' + RISK_COLOR[p.status] + ';">' + RISK_LABEL[p.status] + '</span>' +
                    '<div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px;">' + fmt(p.notional) + ' USD</div>' +
                '</div></div>';
        }).join('');
        var more = flagged.length > MAXROWS
            ? '<div style="font-family:var(--mono);font-size:10px;color:var(--muted);padding-top:6px;">+' + (flagged.length - MAXROWS) + ' more</div>' : '';
        var flaggedNotional = flagged.reduce(function(a, p) { return a + p.notional; }, 0);

        var listHTML = flagged.length
            ? '<div style="' + LBL + 'margin:12px 0 2px;">Needs attention \u00b7 ' + flagged.length + ' put' + (flagged.length > 1 ? 's' : '') +
              ' \u00b7 ' + Math.round(flaggedNotional / total * 100) + '% of notional</div>' + rowsHTML + more
            : '<div style="font-family:var(--mono);font-size:11px;color:#3aad72;margin-top:12px;">\u2705 No puts near the strike or expiring within 7 days.</div>';

        box.innerHTML =
            '<div style="' + LBL + 'margin-bottom:8px;">Put book quality \u00b7 as of ' + stmt + '</div>' +
            '<div style="padding:12px 14px;border-radius:10px;border:0.5px solid var(--border);background:var(--surface2);">' +
                '<div style="display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--border);">' + bar + '</div>' +
                '<div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:8px;line-height:1.7;">' + legend + '</div>' +
                '<div style="font-family:var(--mono);font-size:11px;margin-top:10px;">' +
                    'Raw <b>' + fmt(csvEUR) + '</b> EUR \u2192 risk-weighted <b>' + fmt(csvEUR * riskFactor) + '</b> EUR' +
                    ' <span style="color:var(--muted);">(counts ' + Math.round(riskFactor * 100) + '%)</span></div>' +
                listHTML +
                '<div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:10px;line-height:1.5;">' +
                    'Estimated from option price vs premium collected \u2014 the statement has no underlying prices. ' +
                    'Info only: the loan target and margin use the raw notional.</div>' +
            '</div>';
    }

    // ── LEVERAGE CARD (worst case: every short put assigned) ─────────────
    //   leverage = (stocks + put notional) / NLV,  loan = max(0, total − NLV)
    //   max at target = NLV × (1 + loan%),  buffer = max − total (negative = over the target)
    function renderLeverage(d) {
        var nlv = d.nlv, tot = d.totalExp;
        var lev  = nlv > 0 ? tot / nlv : 0;
        var loan = Math.max(0, tot - nlv);
        var loanPctNow = nlv > 0 ? loan / nlv * 100 : 0;
        var buffer = d.maxTotal - tot;
        var color = d.expZone === 'danger' ? '#e86060' : d.expZone === 'warn' ? '#e8a03a' : '#3aad72';
        var fx = getFX();
        var usd = function(v) { return fmt(Math.abs(v) * fx) + ' USD'; };
        var eur = function(v) { return fmt(Math.abs(v)) + ' EUR'; };

        // Bar scale: 0 .. a bit past the larger of total exposure and the danger line
        var scale = Math.max(tot, d.warnTotal) * 1.08;
        var pos = function(v) { return Math.max(0, Math.min(100, v / scale * 100)).toFixed(2) + '%'; };
        var base = tot - d.wiEUR;   // exposure before the what-if trade
        var bar =
            '<div class="lev-fill" style="width:' + pos(base) + ';background:' + color + ';"></div>' +
            (d.wiEUR > 0 ? '<div class="lev-wi" style="left:' + pos(base) + ';width:' + (Math.min(100, tot / scale * 100) - Math.min(100, base / scale * 100)).toFixed(2) + '%;background:' + color + ';"></div>' : '') +
            '<div class="lev-mark" style="left:' + pos(nlv) + '"><span>NLV</span></div>' +
            (d.loanPct > 0 ? '<div class="lev-mark" style="left:' + pos(d.maxTotal) + '"><span style="top:-15px;">' + d.loanPct + '%</span></div>' : '') +
            '<div class="lev-mark" style="left:' + pos(d.warnTotal) + ';background:#e86060;"><span style="color:#e86060">' + (d.loanPct + LOAN_WARN_BAND) + '%</span></div>';

        var effLev = nlv > 0 ? (d.stocks + d.notionalEff) / nlv : 0;
        el('lev-card').className = 'lev-card ' + d.expZone;
        el('lev-card').innerHTML =
            '<div class="lev-top">' +
                '<div><div class="lev-big" style="color:' + color + '">' + lev.toFixed(2) + 'x</div>' +
                '<div class="lev-cap">Leverage if all puts assigned</div></div>' +
                '<div class="lev-loan"><span style="color:' + color + ';font-weight:700;">Loan ' + loanPctNow.toFixed(1) + '%</span> of NLV' +
                '<div class="lev-cap" style="text-align:right;">target ≤ ' + d.loanPct + '%</div></div>' +
            '</div>' +
            '<div class="lev-bar">' + bar + '</div>' +
            '<div class="lev-grid">' +
                '<span>Stocks</span><span>' + eur(d.stocks) + '</span>' +
                '<span>Short puts' + (d.wiEUR > 0 ? ' (incl. what-if)' : '') + '</span><span>' + eur(d.notional) + ' · ' + usd(d.notional) + '</span>' +
                '<span>Total exposure</span><span><b>' + eur(tot) + '</b></span>' +
                '<span>Loan if all assigned</span><span>' + eur(loan) + ' · ' + usd(loan) + '</span>' +
                '<span>Max at ' + d.loanPct + '% loan</span><span>' + eur(d.maxTotal) + '</span>' +
                '<span>' + (buffer >= 0 ? 'Room left' : 'Over target') + '</span><span style="color:' + (buffer >= 0 ? '#3aad72' : '#e86060') + ';font-weight:700;">' +
                    (buffer >= 0 ? '+' : '−') + eur(buffer) + ' · ' + usd(buffer) + '</span>' +
                (Math.abs(effLev - lev) > 0.005 ? '<span>Risk-weighted (info)</span><span>' + effLev.toFixed(2) + 'x</span>' : '') +
            '</div>' +
            // Today's distance to a margin call (entered from TWS), next to the worst-case view above
            (function() {
                var exPct = nlv > 0 ? d.excess / nlv * 100 : 0;
                var tgtPct = nlv > 0 ? d.targetExcess / nlv * 100 : 0;
                var stopPct = nlv > 0 ? d.stopExcess / nlv * 100 : 0;
                var c = d.excess < d.stopExcess ? '#e86060' : d.excess < d.targetExcess ? '#e8a03a' : '#3aad72';
                return '<div class="lev-grid" style="margin-top:8px;padding-top:8px;border-top:0.5px solid var(--border);">' +
                    (d.wiEUR > 0
                        ? '<span>Excess liquidity today</span><span>' + eur(d.excessIn) + '</span>' +
                          '<span>after the what-if</span><span style="color:' + c + ';font-weight:700;">' + eur(d.excess) + ' · ' + exPct.toFixed(0) + '% of NLV</span>'
                        : '<span>Excess liquidity today</span><span style="color:' + c + ';font-weight:700;">' + eur(d.excess) + ' · ' + exPct.toFixed(0) + '% of NLV</span>') +
                    '<span></span><span style="color:var(--muted);font-size:10px;">target ≥ ' + tgtPct.toFixed(0) + '% (VIX) · hard stop ' + stopPct.toFixed(0) + '%</span>' +
                '</div>';
            })();

        // What-if result (USD trade): verdict + before → after rows, laid out for a phone
        el('wi-res').innerHTML = whatIfHTML(d, base, lev, color);
    }

    function clearWhatIf() {
        ['wi-qty', 'wi-strike', 'wi-tkr', 'wi-exp'].forEach(function(i) { el(i).value = ''; });
        onSliders();
    }

    function whatIfHTML(d, base, lev, levColor) {
        var fx = getFX(), nlv = d.nlv;
        var strike = parseFloat(el('wi-strike').value);
        if (!(strike > 0)) {
            return '<div class="wi-hint">Enter the strike (and contracts) of a put you are thinking of selling: ' +
                   'you see how many fit and what the trade does to leverage, excess, margin cushion and concentration — before placing it.</div>';
        }
        var GREEN = '#3aad72', AMBER = '#e8a03a', RED = '#e86060';
        var usd = function(v) { return '$' + fmt(Math.abs(v) * fx); };
        var pc  = function(v) { return Math.round(v * 100) + '%'; };
        var arrow = function(a, b, col) {
            return '<span class="from">' + a + ' → </span><span style="color:' + (col || 'var(--text)') + '">' + b + '</span>';
        };

        // Same room as the status line / sell card, measured before the what-if trade
        var fit = Math.max(0, Math.floor(d.roomBefore.room * fx / (100 * strike)));
        var plural = function(n) { return n + ' contract' + (n === 1 ? '' : 's'); };
        var qty = parseFloat(el('wi-qty').value) || 0;

        if (!(d.wiEUR > 0)) {
            return '<div class="wi-verdict ' + (fit > 0 ? 'ok' : 'bad') + '">' +
                (fit > 0 ? 'Up to ' + plural(fit) + ' fit at $' + strike : 'No contract fits at $' + strike) +
                '<small>all limits green · binding: ' + bindingLabel(d.roomBefore, d) + '</small></div>' +
                '<div class="wi-hint">Enter contracts to see the impact of the trade.</div>';
        }

        var fits = qty <= fit;
        var html = '<div class="wi-verdict ' + (fits ? 'ok' : 'bad') + '">' +
            (fits ? '✅ Fits — all limits stay green' : '⚠️ Too big') +
            '<small>' + (fits ? '' : 'breaks: ' + bindingLabel(d.roomBefore, d) + ' · ') + 'max ' + plural(fit) + ' at $' + strike + '</small></div>';

        // Before → after
        var levBefore = nlv > 0 ? base / nlv : 0;
        var exB = d.excessIn / nlv, exA = d.excess / nlv;
        var exCol = d.excess < d.stopExcess ? RED : d.excess < d.targetExcess ? AMBER : GREEN;
        var cushB = base > 0 ? d.excessIn / base : Infinity;
        var cushCol = d.cushion >= CUSHION_GREEN ? GREEN : d.cushion >= CUSHION_WARN ? AMBER : RED;

        html += '<div class="wi-rows">' +
            '<span>Notional</span><span>' + usd(d.wiEUR) + '</span>' +
            '<span>Margin used</span><span>~' + usd(d.wiEUR * MARGIN) + '</span>' +
            '<span>Leverage</span><span>' + arrow(levBefore.toFixed(2) + 'x', lev.toFixed(2) + 'x', levColor) + '</span>' +
            '<span>Excess</span><span>' + arrow(pc(exB), pc(exA) + ' NLV', exCol) + '</span>' +
            '<span>Survives drop</span><span>' + arrow(fmtCushion(cushB), fmtCushion(d.cushion), cushCol) + '</span>';

        // Concentration (needs an imported book)
        if (d.conc.hasBook) {
            var c0 = concNow(0, '', '');
            var tkr = el('wi-tkr').value.trim().toUpperCase();
            var dk = whatIfDateKey();
            var tCol = function(v) { return v >= 0.40 ? RED : v >= 0.25 ? AMBER : GREEN; };
            var dCol = function(v) { return v >= 0.35 ? (v >= 0.70 ? RED : AMBER) : GREEN; };
            if (tkr) {
                var ta = d.conc.share(tkr);
                html += '<span>' + escHTML(tkr) + '</span><span>' + arrow(pc(c0.share(tkr)), pc(ta) + ' of book', tCol(ta)) + '</span>';
            } else if (c0.topTicker) {
                var tt = d.conc.share(c0.topTicker);
                html += '<span>New ticker</span><span>' + arrow('top ' + escHTML(c0.topTicker) + ' ' + pc(c0.tickerConc), pc(tt), tCol(tt)) + '</span>';
            }
            if (dk) {
                var da = d.conc.dshare(dk);
                html += '<span>' + dk + '</span><span>' + arrow(pc(c0.dshare(dk)), pc(da) + ' of puts', dCol(da)) + '</span>';
            } else if (c0.topDate) {
                var dd = d.conc.dshare(c0.topDate);
                html += '<span>New expiry</span><span>' + arrow('top ' + c0.topDate + ' ' + pc(c0.dateConc), pc(dd), dCol(dd)) + '</span>';
            }
        }
        return html + '</div>';
    }

    function renderSell(d) {

        var nlv = d.nlv, conc = d.conc;
        var r = d.room;                        // shared with the status line (after any what-if)
        var roomEUR = r.room;
        var hasRoom = roomEUR > 100;

        // Tickers / expiries already heavy in the book (incl. stocks and the what-if)
        var blockedTickers = [];
        var blockedDates   = [];
        Object.keys(conc.tmap).forEach(function(t) {
            var pct = conc.share(t);
            if (pct >= 0.25) blockedTickers.push({ name: t, pct: Math.round(pct * 100) });
        });
        blockedTickers.sort(function(a,b){ return b.pct - a.pct; });
        Object.keys(conc.dmap).forEach(function(dd) {
            var pct = conc.dshare(dd);
            if (pct >= 0.30) blockedDates.push({ name: dd, pct: Math.round(pct * 100) });
        });
        blockedDates.sort(function(a,b){ return b.pct - a.pct; });

        // Suggested expiry months: the next 6 months from today, skipping any month+year
        // that already holds a concentrated expiry ("18DEC26" blocks Dec 2026 only)
        var blockedMonths = blockedDates.map(function(b) { return b.name.slice(-5); });   // "DEC26"
        var suggestions = [];
        var now = new Date();
        for (var i = 1; i <= 6 && suggestions.length < 3; i++) {
            var m = new Date(now.getFullYear(), now.getMonth() + i, 1);
            var key = MON3[m.getMonth()] + String(m.getFullYear()).slice(2);
            if (blockedMonths.indexOf(key) >= 0) continue;
            suggestions.push(m.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' }));
        }

        // Meters: bar = axis score, text = the real figure vs. its green limit
        var scores = d.scores;
        var liqPct = Math.round(scores[0] * 100), expPct = Math.round(scores[2] * 100), mrgPct = Math.round(scores[3] * 100);

        function meterColor(s) { return s >= 70 ? '#3aad72' : s >= 40 ? '#e8a03a' : '#e86060'; }

            return '<div class="sell-meter-row"><div class="sell-meter-label">' + label + '</div>' +

                '<div class="sell-meter-val" style="color:' + meterColor(pct) + '">' + txt + '</div></div>';
        }

        var blockedTickerHTML = blockedTickers.length
            ? blockedTickers.map(function(t){ return '<span class="sell-tag sell-tag-r">'+escHTML(t.name)+' '+t.pct+'%</span>'; }).join('')
            : '<span class="sell-tag sell-tag-g">No ticker near limit</span>';

        var blockedDateHTML = blockedDates.length
            ? blockedDates.map(function(b){ return '<span class="sell-tag sell-tag-r">'+b.name+' '+b.pct+'%</span>'; }).join('')
            : '<span class="sell-tag sell-tag-g">Dates well spread</span>';

        var suggestHTML = suggestions.length
            ? suggestions.map(function(s){ return '<span class="sell-tag sell-tag-g">'+s+'</span>'; }).join('')

        var idealNotional = Math.min(roomEUR, nlv * 0.15);
        var idealHTML = hasRoom
            ? '<span class="sell-tag sell-tag-g">New ticker</span>' +
              (suggestions[0] ? '<span class="sell-tag sell-tag-g">Exp ' + suggestions[0] + '</span>' : '') +
              '<span class="sell-tag sell-tag-g">Notional ≤ ' + fmt(idealNotional) + ' EUR</span>'
            : '<span class="sell-tag sell-tag-o">None — no room for new puts right now</span>';

        el('sell-content').innerHTML =
            '<div class="sell-card" style="border-color:rgba(58,173,114,0.3)">' +
                '<div class="sell-headline" style="color:' + (hasRoom ? '#3aad72' : '#e86060') + '">' +
                    (hasRoom ? '+' + fmt(roomEUR) + ' EUR notional' : 'No room to add') +
                '</div>' +
                '<div class="sell-sub">' +
                    (hasRoom
                        ? 'You can open new short puts up to this amount while every limit stays green' + (d.wiEUR > 0 ? ' (after the what-if trade).' : '.')
                        : 'Reduce existing positions before opening new ones.') +
                '</div>' +
                '<div class="sell-constraint">Binding constraint: ' + bindingLabel(r, d) + '</div>' +
                '<div style="margin-top:10px">' +
                    meter('Liquidity', liqPct, liqTxt) +
                    meter('Exposure', expPct, expTxt) +
                    meter('Margin', mrgPct, mrgTxt) +

                '<div class="sell-rule">' +
                    '<div class="sell-rule-icon" style="background:rgba(232,96,96,0.10)">🚫</div>' +
                    '<div class="sell-rule-text">Avoid these tickers<span class="sell-rule-sub">Close to the limit: ≥ 25% of the book (stocks + puts), radar limit 40%</span><div style="margin-top:5px">'+blockedTickerHTML+'</div></div>' +
                '</div>' +
                '<div class="sell-rule">' +
                    '<div class="sell-rule-icon" style="background:rgba(232,96,96,0.10)">📅</div>' +
                    '<div class="sell-rule-text">Avoid these expiry dates<span class="sell-rule-sub">Close to the limit: ≥ 30% of put notional, radar limit 35%</span><div style="margin-top:5px">'+blockedDateHTML+'</div></div>' +
                '</div>' +
                '<div class="sell-rule">' +
                    '<div class="sell-rule-icon" style="background:rgba(58,173,114,0.10)">✅</div>' +
