<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="hub_shared.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Put Coach</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0f0e0c;
    --surface: #1a1916;
    --surface2: #242220;
    --border: #3e3b35;
    --text: #ede8e0;
    --muted: #a09890;
    --accent: #e8753a;
    --safe: #3aad72;
    --warn: #e8a03a;
    --danger: #e86060;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
}
[data-theme="light"] {
    --bg: #f2f0eb;
    --surface: #ffffff;
    --surface2: #eeebe6;
    --border: #ccc9c2;
    --text: #1a1814;
    --muted: #5a5650;
    --accent: #c8521a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 28px 16px 48px;
    transition: background .3s, color .3s;
}
.shell { width: 100%; max-width: 520px; }

/* Card */
.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 26px 24px 28px;
    box-shadow: 0 8px 40px rgba(0,0,0,.28);
}

/* Header */
.hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.hdr-left { display: flex; flex-direction: column; gap: 2px; }
.eyebrow { font-family: var(--mono); font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.title { font-family: var(--mono); font-size: 19px; font-weight: 700; }
.btn-sm {
    font-family: var(--mono); font-size: 10px; padding: 5px 11px;
    border-radius: 7px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--muted);
    cursor: pointer; transition: all .2s; letter-spacing: .06em;
}
.btn-sm:hover { border-color: var(--accent); color: var(--accent); }

/* Mode pills */
.mode-row { display: flex; gap: 6px; margin-bottom: 20px; }
.mode-pill {
    flex: 1; padding: 9px 4px;
    border-radius: 9px; border: 1.5px solid var(--border);
    background: var(--surface2); color: var(--muted);
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    letter-spacing: .05em; text-transform: uppercase;
    cursor: pointer; transition: all .2s; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.mode-pill small { font-size: 9px; font-family: var(--sans); font-weight: 400; letter-spacing: 0; opacity: .7; }
.mode-pill.sel-c { border-color: var(--accent); color: var(--accent); background: rgba(232,117,58,.08); }
.mode-pill.sel-c small { opacity: 1; }
.mode-pill.sel-m { border-color: var(--safe); color: var(--safe); background: rgba(58,173,114,.08); }
.mode-pill.sel-m small { opacity: 1; }
.mode-pill.sel-a { border-color: var(--warn); color: var(--warn); background: rgba(232,160,58,.08); }
.mode-pill.sel-a small { opacity: 1; }

/* Net liq input — big and prominent */
.nlv-wrap { margin-bottom: 20px; }
.nlv-label { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: block; }
.nlv-input-row { display: flex; align-items: center; gap: 10px; }
.nlv-input {
    flex: 1; padding: 13px 16px;
    border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--surface2); color: var(--text);
    font-size: 22px; font-family: var(--mono); font-weight: 700;
    outline: none; transition: border-color .2s, box-shadow .2s;
    -moz-appearance: textfield;
}
.nlv-input::-webkit-outer-spin-button,
.nlv-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.nlv-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,117,58,.1); }
.nlv-input::placeholder { color: var(--muted); font-size: 15px; font-weight: 400; }

/* VIX row */
.vix-row { margin-bottom: 20px; }
.vix-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.vix-val { font-family: var(--mono); font-size: 16px; font-weight: 700; transition: color .3s; }
.vix-tag { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .08em; padding: 2px 7px; border-radius: 20px; }
.vt-calm   { background: rgba(58,173,114,.15); color: #3aad72; }
.vt-tense  { background: rgba(232,160,58,.15); color: #e8a03a; }
.vt-fear   { background: rgba(232,96,96,.15);  color: #e86060; }
input[type="range"] {
    -webkit-appearance: none; width: 100%; height: 4px;
    border-radius: 2px; background: var(--border); outline: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--surface);
    box-shadow: 0 0 0 2px var(--accent); cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--surface); cursor: pointer;
}
.vix-scale { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 9px; color: var(--muted); margin-top: 3px; }

/* Divider */
.div { height: 1px; background: var(--border); margin: 18px 0; }

/* Radar chart */
.radar-wrap {
    position: relative; margin: 4px auto 0;
    width: 100%; max-width: 340px;
}
.radar-wrap svg { width: 100%; height: auto; display: block; }
.radar-legend {
    display: flex; gap: 18px; justify-content: center;
    margin-top: 10px; flex-wrap: wrap;
}
.radar-leg-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-family: var(--mono); color: var(--muted); }
.radar-leg-dot { width: 10px; height: 3px; border-radius: 2px; flex-shrink: 0; }

/* Position sliders */
.sliders-wrap { margin-top: 20px; }
.slider-field { margin-bottom: 16px; }
.slider-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.slider-label { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.slider-val { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--text); transition: color .3s; }

/* You-are-here status */
.you-status {
    border-radius: 11px; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    margin-top: 18px;
    background: var(--surface2); border: 1.5px solid var(--border);
    transition: all .3s;
}
.you-status.safe   { border-color: #3aad72; background: rgba(58,173,114,.06); }
.you-status.warn   { border-color: #e8a03a; background: rgba(232,160,58,.06); }
.you-status.danger { border-color: #e86060; background: rgba(232,96,96,.06); }
.you-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex-shrink: 0; transition: all .3s; }
.you-status.safe   .you-dot { background: #3aad72; box-shadow: 0 0 0 3px rgba(58,173,114,.2); }
.you-status.warn   .you-dot { background: #e8a03a; box-shadow: 0 0 0 3px rgba(232,160,58,.2); }
.you-status.danger .you-dot { background: #e86060; box-shadow: 0 0 0 3px rgba(232,96,96,.2); }
.you-text { flex: 1; }
.you-headline { font-size: 15px; font-weight: 600; }
.you-status.safe   .you-headline { color: #3aad72; }
.you-status.warn   .you-headline { color: #e8a03a; }
.you-status.danger .you-headline { color: #e86060; }
.you-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 2px; }

/* Currency toggle */
.cur-toggle {
    display: flex; border-radius: 6px; overflow: hidden;
    border: 1px solid var(--border); flex-shrink: 0;
}
.cur-btn {
    padding: 2px 7px; font-family: var(--mono); font-size: 9px;
    font-weight: 700; letter-spacing: .06em; border: none;
    background: var(--surface2); color: var(--muted);
    cursor: pointer; transition: all .15s;
}
.cur-btn.active { background: var(--accent); color: #fff; }

.empty-state { text-align: center; padding: 28px 0; color: var(--muted); font-family: var(--mono); font-size: 12px; }

/* Axis legend table */
.ax-row {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    gap: 0 10px;
    align-items: center;
    padding: 7px 10px;
    border-radius: 8px;
    margin-bottom: 4px;
    background: var(--surface2);
    border: 1px solid var(--border);
}
.ax-row:last-child { margin-bottom: 0; }
.ax-name { font-family: var(--mono); font-size: 9px; letter-spacing:.08em; text-transform:uppercase; color: var(--muted); }
.ax-val  { font-family: var(--mono); font-size: 12px; font-weight: 700; text-align:right; min-width: 52px; }
.ax-opt  { font-family: var(--mono); font-size: 9px; color: var(--muted); text-align:right; min-width: 52px; }
.ax-bar-wrap { grid-column: 1 / -1; height: 4px; background: var(--border); border-radius: 2px; margin-top: 3px; position:relative; overflow:visible; }
.ax-bar-fill { height: 100%; border-radius: 2px; transition: width .4s; }
.ax-bar-tgt  { position:absolute; top:-2px; width:2px; height:8px; border-radius:1px; background: rgba(58,173,114,0.7); }
.ax-zones    { grid-column: 1 / -1; display:flex; gap:4px; margin-top:4px; flex-wrap:wrap; }
.ax-zone-pill { font-family:var(--mono); font-size:8px; padding: 1px 6px; border-radius:10px; white-space:nowrap; }

/* Sell section */
.sell-card { background:var(--surface2); border:0.5px solid var(--border); border-radius:10px; padding:14px; margin-bottom:8px; }
.sell-headline { font-family:var(--mono); font-size:20px; font-weight:700; margin-bottom:3px; }
.sell-sub { font-family:var(--mono); font-size:10px; color:var(--muted); line-height:1.6; }
.sell-constraint { font-family:var(--mono); font-size:8px; letter-spacing:.08em; text-transform:uppercase; color:#e8a03a; margin-top:8px; }
.sell-rule { display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-top:0.5px solid var(--border); }
.sell-rule:first-child { border-top:none; padding-top:0; }
.sell-rule-icon { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:12px; }
.sell-rule-text { font-family:var(--mono); font-size:10px; color:var(--text); line-height:1.5; }
.sell-rule-text .sell-rule-sub { color:var(--muted); font-size:9px; display:block; margin-top:1px; }
.sell-tag { display:inline-block; font-family:var(--mono); font-size:9px; padding:2px 7px; border-radius:10px; margin:3px 3px 0 0; }
.sell-tag-r { background:rgba(232,96,96,0.12); color:#e86060; }
.sell-tag-o { background:rgba(232,160,58,0.12); color:#e8a03a; }
.sell-tag-g { background:rgba(58,173,114,0.12); color:#3aad72; }
.sell-meter-row { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
.sell-meter-label { font-family:var(--mono); font-size:9px; color:var(--muted); width:80px; flex-shrink:0; }
.sell-meter-bar { flex:1; height:5px; background:var(--border); border-radius:3px; overflow:hidden; }
.sell-meter-fill { height:100%; border-radius:3px; }
.sell-meter-val { font-family:var(--mono); font-size:9px; font-weight:700; width:32px; text-align:right; }
</style>
</head>
<body data-theme="dark">
<div class="shell">
<div class="card">

    <!-- Header -->
    <div class="hdr">
        <div class="hdr-left">
            <span class="eyebrow">Risk manager</span>
            <span class="title">Put Coach</span>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
            <label class="btn-sm" for="ibkr-file" style="cursor:pointer;" title="Import IBKR Activity Statement CSV">📂 Import</label>
            <input type="file" id="ibkr-file" accept=".csv" style="display:none;" onchange="importIBKR(this)">
            <button class="btn-sm" onclick="toggleTheme()">Theme</button>
        </div>
    </div>

    <!-- Import status banner -->
    <div id="import-banner" style="display:none;align-items:center;gap:10px;padding:9px 14px;border-radius:9px;margin-bottom:14px;font-size:12px;background:rgba(58,173,114,0.08);border:1px solid rgba(58,173,114,0.25);">
        <span style="font-size:16px;">✅</span>
        <div style="flex:1;font-family:var(--mono);font-size:11px;color:var(--muted);" id="import-msg">—</div>
        <button onclick="clearImport()" style="border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 4px;">✕</button>
    </div>

    <!-- Mode -->
    <div class="mode-row">
        <button class="mode-pill" id="mp-conservative" onclick="setMode('conservative')">🛡️ Conservative<br><small>Stop 40%</small></button>
        <button class="mode-pill sel-m" id="mp-moderate"     onclick="setMode('moderate')">⚖️ Moderate<br><small>Stop 30%</small></button>
        <button class="mode-pill" id="mp-aggressive"   onclick="setMode('aggressive')">🔥 Aggressive<br><small>Stop 20%</small></button>
    </div>

    <!-- VIX slider -->
    <div class="vix-row">
        <div class="vix-header">
            <span class="vix-label" style="font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);">VIX</span>
            <div style="display:flex;align-items:center;gap:8px;">
                <span class="vix-val" id="vix-val">18</span>
                <span class="vix-tag vt-calm" id="vix-tag">Calm</span>
            </div>
        </div>
        <input type="range" id="vix-slider" min="5" max="60" step="0.5" value="18" oninput="onVix()">
        <div class="vix-scale">
            <span>5</span>
            <span style="color:#3aad72">20 calm</span>
            <span style="color:#e8a03a">30 tense</span>
            <span>60</span>
        </div>
    </div>

    <!-- Position sliders -->
    <div class="sliders-wrap">
        <div class="slider-field">
            <div class="slider-header">
                <div style="display:flex;align-items:center;gap:8px;">
                    <span class="slider-label">Your excess liq</span>
                    <div class="cur-toggle" id="exc-cur-toggle">
                        <button class="cur-btn active" onclick="setCur('exc','EUR')">EUR</button>
                        <button class="cur-btn" onclick="setCur('exc','USD')">USD</button>
                    </div>
                </div>
                <span class="slider-val" id="exc-val">—</span>
            </div>
            <input type="range" id="exc-slider" min="0" step="1000" oninput="onSliders()">
            <div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px;" id="exc-converted"></div>
        </div>
        <div class="slider-field">
            <div class="slider-header">
                <div style="display:flex;align-items:center;gap:8px;">
                    <span class="slider-label">Put notional sold</span>
                    <div class="cur-toggle" id="not-cur-toggle">
                        <button class="cur-btn" onclick="setCur('not','EUR')">EUR</button>
                        <button class="cur-btn active" onclick="setCur('not','USD')">USD</button>
                    </div>
                </div>
                <span class="slider-val" id="not-val">—</span>
            </div>
            <input type="range" id="not-slider" min="0" step="1000" oninput="onSliders()">
            <div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px;" id="not-converted"></div>
        </div>
    </div>

    <!-- Net liq + FX rate -->
    <div class="nlv-wrap">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
            <label class="nlv-label" for="nlv" style="margin-bottom:0;">Net liquidation value</label>
            <div style="display:flex; align-items:center; gap:8px;">
                <span style="font-family:var(--mono);font-size:9px;color:var(--muted);">EUR/USD</span>
                <input type="number" id="fx-rate" min="0.5" max="2" step="0.001" value="1.17"
                       oninput="render()"
                       style="font-family:var(--mono);font-size:12px;font-weight:700;padding:4px 8px;width:66px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);outline:none;-moz-appearance:textfield;text-align:center;">
                <span id="fx-date" style="font-family:var(--mono);font-size:9px;color:var(--muted);"></span>
                <div class="cur-toggle" id="nlv-cur-toggle">
                    <button class="cur-btn active" onclick="setCur('nlv','EUR')">EUR</button>
                    <button class="cur-btn" onclick="setCur('nlv','USD')">USD</button>
                </div>
            </div>
        </div>
        <input class="nlv-input" type="number" id="nlv" min="0" step="1000"
               placeholder="e.g. 100 000" oninput="render()" style="width:100%;">
        <div id="nlv-converted" style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:5px;display:none;"></div>
    </div>

    <!-- Radar chart -->
    <div id="table-section" style="display:none;">
        <div class="div" style="margin-top:0;"></div>

        <div class="radar-wrap">
            <svg id="radar-svg" viewBox="0 0 390 390" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:100%;"></svg>
            <div class="radar-legend">
                <div class="radar-leg-item"><div class="radar-leg-dot" style="background:#4a9d6e;opacity:.5;height:8px;width:8px;border-radius:50%;"></div>Target zone</div>
                <div class="radar-leg-item"><div class="radar-leg-dot" style="background:#e8753a;height:2px;width:12px;"></div>Your position</div>
            </div>
        </div>

        <!-- Axis legend table -->
        <div id="axis-legend" style="margin-top:14px;">
            <div style="font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;">Axis breakdown</div>
            <div id="axis-rows"></div>
        </div>

        <!-- Status -->
        <div class="you-status" id="you-status">
            <div class="you-dot"></div>
            <div class="you-text">
                <div class="you-headline" id="you-headline">Move the sliders above</div>
                <div class="you-sub" id="you-sub">to see where you stand</div>
            </div>
        </div>

        <!-- What can I sell -->
        <div id="sell-section" style="margin-top:14px;display:none;">
            <button id="sell-toggle" onclick="toggleSell()" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:10px;border:0.5px solid var(--border);background:var(--surface2);cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;">
                <span>What can I sell today?</span>
                <span id="sell-arrow" style="font-size:14px;transition:transform .2s;">▸</span>
            </button>
            <div id="sell-body" style="display:none;margin-top:8px;">
                <div id="sell-content"></div>
            </div>
        </div>
    </div>

    <div id="empty-state" class="empty-state">Enter your net liq value above</div>

</div>
</div>

<script>
    const MODES = {
        conservative: { hardStop: 40, vixBase: 50, vixSlope: 0.50, vixCap: 70 },
        moderate:     { hardStop: 30, vixBase: 40, vixSlope: 0.75, vixCap: 60 },
        aggressive:   { hardStop: 20, vixBase: 30, vixSlope: 0.50, vixCap: 45 },
    };
    // Exposure zone multiples per mode
    const EXP = {
        conservative: { g: 0.75, o: 1.5 },
        moderate:     { g: 1.0,  o: 2.0 },
        aggressive:   { g: 1.5,  o: 3.0 },
    };
    const MARGIN = 0.20;

    let currentMode = 'moderate';
    // Currency selections: 'EUR' or 'USD' for each field
    var curNLV = 'EUR';
    var curExc = 'EUR';
    var curNot = 'USD';

    // Concentration data parsed from IBKR CSV
    var gTickerConc = 0;
    var gDateConc   = 0;
    var gTickerMap  = {};
    var gDateMap    = {};
    var gNotionalUSD = 0;

    function getFX() { return parseFloat(el('fx-rate').value) || 1.08; }

    // Convert input value to EUR for calculations
    function toEUR(val, cur) {
        return cur === 'USD' ? val / getFX() : val;
    }
    // Convert EUR amount to display currency
    function fromEUR(val, cur) {
        return cur === 'USD' ? val * getFX() : val;
    }

    function setCur(field, cur) {
        if (field === 'nlv') curNLV = cur;
        if (field === 'exc') curExc = cur;
        if (field === 'not') curNot = cur;

        // Update toggle button states
        var toggle = el(field + '-cur-toggle');
        toggle.querySelectorAll('.cur-btn').forEach(function(btn) {
            btn.classList.toggle('active', btn.textContent === cur);
        });

        // Update slider ranges and redraw
        render();
    }

    function el(id) { return document.getElementById(id); }
    function fmt(n) {
        if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
        if (n >= 1e3) return (n/1e3).toFixed(0) + 'k';
        return n.toFixed(0);
    }

    function toggleTheme() {
        var t = document.body.getAttribute('data-theme');
        document.body.setAttribute('data-theme', t === 'dark' ? 'light' : 'dark');
    }

    function setMode(m) {
        currentMode = m;
        ['conservative','moderate','aggressive'].forEach(function(x) {
            var cls = 'mode-pill' + (x === m ? (' sel-' + x[0]) : '');
            el('mp-' + x).className = cls;
        });
        render();
    }

    function onVix() {
        var v = parseFloat(el('vix-slider').value);
        el('vix-val').textContent = v % 1 === 0 ? v : v.toFixed(1);
        var tag = el('vix-tag');
        if (v < 20)      { el('vix-val').style.color = '#3aad72'; tag.textContent = 'Calm';  tag.className = 'vix-tag vt-calm'; }
        else if (v < 30) { el('vix-val').style.color = '#e8a03a'; tag.textContent = 'Tense'; tag.className = 'vix-tag vt-tense'; }
        else             { el('vix-val').style.color = '#e86060'; tag.textContent = 'Fear';  tag.className = 'vix-tag vt-fear'; }
        render();
    }

    function getTarget() {
        var vix = parseFloat(el('vix-slider').value);
        var cfg = MODES[currentMode];
        var t = cfg.vixBase + Math.max(0, vix - 15) * cfg.vixSlope;
        return Math.min(cfg.vixCap, t);
    }

    function render() {
        var nlvRaw = parseFloat(el('nlv').value);
        if (isNaN(nlvRaw) || nlvRaw <= 0) {
            el('table-section').style.display = 'none';
            el('empty-state').style.display = 'block';
            return;
        }
        el('table-section').style.display = 'block';
        el('empty-state').style.display = 'none';

        var nlvEUR = toEUR(nlvRaw, curNLV);

        // Show conversion hint under NLV
        var nlvConv = el('nlv-converted');
        if (curNLV === 'USD') {
            nlvConv.textContent = '≈ ' + fmt(nlvEUR) + ' EUR';
        } else {
            nlvConv.textContent = '';
        }

        var cfg = MODES[currentMode];
        var target = getTarget();
        var exp = EXP[currentMode];

        var orangeNotional = exp.o * nlvEUR;

        // Slider max in their respective currencies
        el('exc-slider').max = Math.round(fromEUR(nlvEUR, curExc));
        el('not-slider').max = Math.round(fromEUR(orangeNotional * 1.5, curNot));

        onSliders();
    }

    // ── RADAR CHART ───────────────────────────────────────────────────────
    var AXES = ['Liquidity', 'VIX Buffer', 'Exposure Safety', 'Margin Safety', 'Ticker Conc.', 'Date Conc.'];
    var N = AXES.length;
    var CX = 195, CY = 190, R = 128;

    function axisPoint(i, r) {
        var angle = (Math.PI * 2 * i / N) - Math.PI / 2;
        return { x: CX + r * Math.cos(angle), y: CY + r * Math.sin(angle) };
    }

    function polyPoints(values) {
        return values.map(function(v, i) {
            var p = axisPoint(i, v * R);
            return p.x.toFixed(1) + ',' + p.y.toFixed(1);
        }).join(' ');
    }

    function drawRadar(scores, targetScores, zone) {
        var isDark = document.body.getAttribute('data-theme') !== 'light';
        var axisColor  = isDark ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.15)';
        var labelColor = isDark ? '#c8c0b4' : '#5a5650';
        var zoneColor  = zone === 'safe' ? '#3aad72' : zone === 'warn' ? '#e8a03a' : '#e86060';
        var zoneAlpha  = zone === 'safe' ? '0.20' : zone === 'warn' ? '0.18' : '0.14';
        var bgColor    = isDark ? '#16221a' : '#e8f2ec';

        var svg = '';

        // ── Dark circle background ────────────────────────────────────────
        svg += '<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="'+bgColor+'" opacity="0.55"/>';

        // ── Circular grid rings ───────────────────────────────────────────
        var rings = [
            { r: 0.2, color: 'rgba(255,255,255,0.07)', w: '0.8' },
            { r: 0.4, color: 'rgba(232,96,96,0.35)',   w: '1.2', dash: '4,3' },
            { r: 0.6, color: 'rgba(255,255,255,0.07)', w: '0.8' },
            { r: 0.7, color: 'rgba(232,160,58,0.35)',  w: '1.2', dash: '4,3' },
            { r: 0.8, color: 'rgba(255,255,255,0.07)', w: '0.8' },
            { r: 1.0, color: 'rgba(58,173,114,0.30)',  w: '1.2' },
        ];
        rings.forEach(function(ring) {
            var attr = ' cx="'+CX+'" cy="'+CY+'" r="'+(ring.r*R).toFixed(1)+'" fill="none" stroke="'+ring.color+'" stroke-width="'+ring.w+'"';
            if (ring.dash) attr += ' stroke-dasharray="'+ring.dash+'"';
            svg += '<circle'+attr+'/>';
        });

        // ── % labels on rings (upper-right between top and right axis) ────
        [
            { r: 0.4, label: '40%', color: '#e86060' },
            { r: 0.7, label: '70%', color: '#e8a03a' },
            { r: 1.0, label: '100%', color: '#3aad72' },
        ].forEach(function(m) {
            // Place label at 45° angle (between top and right axes) outside the ring
            var angle = -Math.PI / 2 + Math.PI * 2 / N * 0.5; // halfway between axis 0 and 1
            var px = CX + m.r * R * Math.cos(angle);
            var py = CY + m.r * R * Math.sin(angle);
            svg += '<text x="'+(px+4).toFixed(1)+'" y="'+(py+4).toFixed(1)+'" font-family="Space Mono,monospace" font-size="8" fill="'+m.color+'" font-weight="700" opacity="0.85">'+m.label+'</text>';
        });

        // ── Axis lines ───────────────────────────────────────────────────
        for (var i = 0; i < N; i++) {
            var tip = axisPoint(i, R);
            svg += '<line x1="'+CX+'" y1="'+CY+'" x2="'+tip.x.toFixed(1)+'" y2="'+tip.y.toFixed(1)+'" stroke="'+axisColor+'" stroke-width="1"/>';
        }

        // ── Target polygon ───────────────────────────────────────────────
        svg += '<polygon points="'+polyPoints(targetScores)+'" fill="rgba(58,173,114,0.08)" stroke="rgba(58,173,114,0.45)" stroke-width="1.5" stroke-dasharray="5,3"/>';

        // ── Your position polygon ────────────────────────────────────────
        var fillRgb = zone==='safe' ? '58,173,114' : zone==='warn' ? '232,160,58' : '232,96,96';
        svg += '<polygon points="'+polyPoints(scores)+'" fill="rgba('+fillRgb+','+zoneAlpha+')" stroke="'+zoneColor+'" stroke-width="2.5" stroke-linejoin="round"/>';

        // ── Dots ─────────────────────────────────────────────────────────
        scores.forEach(function(v, i) {
            var p = axisPoint(i, v*R);
            svg += '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="5" fill="'+zoneColor+'" stroke="'+bgColor+'" stroke-width="2"/>';
        });

        // ── Axis labels ──────────────────────────────────────────────────
        AXES.forEach(function(label, i) {
            var p = axisPoint(i, R + 26);
            // For 6 axes: 0=top, 1=upper-right, 2=lower-right, 3=bottom, 4=lower-left, 5=upper-left
            var anchor = (i === 0 || i === 3) ? 'middle' : (i === 1 || i === 2) ? 'start' : 'end';
            var words = label.toUpperCase().split(' ');
            var line1 = words[0], line2 = words.slice(1).join(' ');
            var dy1 = line2 ? '-5' : '4';
            svg += '<text x="'+p.x.toFixed(1)+'" y="'+p.y.toFixed(1)+'" text-anchor="'+anchor+'" font-family="Space Mono,monospace" font-size="10" font-weight="700" fill="'+labelColor+'" letter-spacing="0.06em">'
                +'<tspan x="'+p.x.toFixed(1)+'" dy="'+dy1+'">'+line1+'</tspan>'
                +(line2 ? '<tspan x="'+p.x.toFixed(1)+'" dy="14">'+line2+'</tspan>' : '')
                +'</text>';
        });

        // ── Score pill near each dot ──────────────────────────────────────
        scores.forEach(function(v, i) {
            // Offset label away from center
            var offset = v > 0.12 ? -18 : 18;
            var p = axisPoint(i, v*R + offset);
            var pct = Math.round(v*100)+'%';
            var sc = v>=0.7 ? '58,173,114' : v>=0.4 ? '232,160,58' : '232,96,96';
            svg += '<rect x="'+(p.x-13).toFixed(1)+'" y="'+(p.y-7).toFixed(1)+'" width="26" height="14" rx="4" fill="rgba('+sc+',0.22)"/>';
            svg += '<text x="'+p.x.toFixed(1)+'" y="'+(p.y+4.5).toFixed(1)+'" text-anchor="middle" font-family="Space Mono,monospace" font-size="9.5" fill="rgb('+sc+')" font-weight="700">'+pct+'</text>';
        });

        el('radar-svg').innerHTML = svg;
    }

    function onSliders() {
        var nlvRaw = parseFloat(el('nlv').value);
        if (isNaN(nlvRaw) || nlvRaw <= 0) return;

        var excessRaw   = parseFloat(el('exc-slider').value);
        var notionalRaw = parseFloat(el('not-slider').value);

        var nlv      = toEUR(nlvRaw, curNLV);
        var excess   = toEUR(excessRaw, curExc);
        var notional = toEUR(notionalRaw, curNot);

        // Display values with currency symbol
        el('exc-val').textContent = fmt(excessRaw) + ' ' + curExc;
        el('not-val').textContent = fmt(notionalRaw) + ' ' + curNot;

        // Show conversion hint
        var excConv = el('exc-converted');
        if (curExc === 'USD') {
            excConv.textContent = '≈ ' + fmt(excess) + ' EUR';
        } else {
            excConv.textContent = '';
        }
        var notConv = el('not-converted');
        if (curNot === 'USD') {
            notConv.textContent = '≈ ' + fmt(notional) + ' EUR';
        } else {
            notConv.textContent = '';
        }

        var cfg    = MODES[currentMode];
        var target = getTarget();
        var exp    = EXP[currentMode];
        var vix    = parseFloat(el('vix-slider').value);

        var stopExcess    = (cfg.hardStop / 100) * nlv;
        var targetExcess  = (target / 100) * nlv;
        var greenNotional  = exp.g * nlv;
        var orangeNotional = exp.o * nlv;

        // ── Compute 0..1 scores for each axis ───────────────────────────
        // Convention: score ≥ 0.70 = green, 0.40–0.70 = warn, < 0.40 = danger

        // 1. LIQUIDITY
        // Green: excess ≥ targetExcess, Warn: stopExcess–targetExcess, Danger: < stopExcess
        var liqScore;
        if (excess >= targetExcess) {
            liqScore = 1.0;
        } else if (excess >= stopExcess) {
            liqScore = 0.40 + ((excess - stopExcess) / (targetExcess - stopExcess)) * 0.30;
        } else {
            liqScore = Math.max(0, (excess / stopExcess) * 0.40);
        }

        // 2. VIX BUFFER
        // Green: VIX < 20, Warn: 20–30, Danger: > 30
        var vixScore;
        if (vix < 20) {
            vixScore = 0.70 + ((20 - vix) / 15) * 0.30; // 0.70..1.0
        } else if (vix <= 30) {
            vixScore = 0.40 + ((30 - vix) / 10) * 0.30; // 0.40..0.70
        } else {
            vixScore = Math.max(0, 0.40 - ((vix - 30) / 30) * 0.40); // 0..0.40
        }

        // 3. EXPOSURE SAFETY
        // Green: ≤ greenNotional, Warn: green–orange, Danger: > orangeNotional
        var expScore;
        if (notional <= 0) {
            expScore = 1.0;
        } else if (notional <= greenNotional) {
            expScore = 0.70 + (1 - notional / greenNotional) * 0.30;
        } else if (notional <= orangeNotional) {
            expScore = 0.40 + ((orangeNotional - notional) / (orangeNotional - greenNotional)) * 0.30;
        } else {
            expScore = Math.max(0, 0.40 - ((notional - orangeNotional) / orangeNotional) * 0.40);
        }

        // 4. MARGIN SAFETY
        // Green: excess ≥ marginUsed + stopExcess, Danger: below that
        var marginUsed = notional * MARGIN;
        var marginTarget = marginUsed + stopExcess;
        var marginScore;
        if (marginUsed <= 0) {
            marginScore = 1.0;
        } else if (excess >= marginTarget) {
            marginScore = 0.70 + Math.min(0.30, ((excess - marginTarget) / marginTarget) * 0.30);
        } else {
            marginScore = Math.max(0, (excess / marginTarget) * 0.70);
        }

        // 5. TICKER CONCENTRATION
        // Green: <40% (<0.40), Warn: 40-60%, Danger: >60%
        // Map: 0.40 → score 0.70, 0.60 → score 0.40, 1.0 → score 0
        var tickerScore = gTickerConc <= 0.40
            ? 0.70 + (1 - gTickerConc / 0.40) * 0.30   // 0.70..1.0 range for green
            : Math.max(0, 0.70 - ((gTickerConc - 0.40) / 0.20) * 0.30); // warn→danger

        // 6. DATE CONCENTRATION
        // Green: <35% (<0.35), Warn: 35-70%, Danger: >70%
        var dateScore = gDateConc <= 0.35
            ? 0.70 + (1 - gDateConc / 0.35) * 0.30
            : Math.max(0, 0.70 - ((gDateConc - 0.35) / 0.35) * 0.70);

        var scores = [liqScore, vixScore, expScore, marginScore, tickerScore, dateScore];

        // Target scores — the green zone boundary (0.70), not the theoretical maximum
        var targetScores = [
            0.70,  // Liquidity: just at the green threshold (= targetExcess)
            vixScore < 0.70 ? vixScore : 0.70 + ((20 - Math.min(vix, 20)) / 15) * 0.30, // VIX: score at VIX=20
            0.70,  // Exposure: score at greenNotional boundary
            0.70,  // Margin: score at margin+stop boundary
            0.70,  // Ticker: score at 40% boundary
            0.70,  // Date: score at 35% boundary
        ];

        // Zone logic (same as before)
        var liqZone = excess < stopExcess ? 'danger' : excess < targetExcess ? 'warn' : 'safe';
        var expZone = notional <= greenNotional ? 'safe' : notional <= orangeNotional ? 'warn' : 'danger';
        var zoneRank = { safe: 0, warn: 1, danger: 2 };
        var effectiveLiq = notional > 0 ? liqZone : (excess < stopExcess ? 'danger' : 'safe');
        var zone = zoneRank[effectiveLiq] >= zoneRank[expZone] ? effectiveLiq : expZone;

        // Colour slider values
        el('exc-val').style.color = liqZone === 'danger' ? '#e86060' : liqZone === 'warn' ? '#e8a03a' : '#3aad72';
        el('not-val').style.color = notional > orangeNotional ? '#e86060' : notional > greenNotional ? '#e8a03a' : '#3aad72';

        // Draw radar
        drawRadar(scores, targetScores, zone);

        // Render axis legend table
        renderAxisLegend({
            nlv: nlv, excess: excess, notional: notional, vix: vix,
            stopExcess: stopExcess, targetExcess: targetExcess,
            greenNotional: greenNotional, orangeNotional: orangeNotional,
            marginUsed: marginUsed,
            scores: scores, targetScores: targetScores
        });

        // Render what can I sell
        renderSell({
            nlv: nlv, excess: excess, notional: notional,
            stopExcess: stopExcess, targetExcess: targetExcess,
            greenNotional: greenNotional, orangeNotional: orangeNotional,
            marginUsed: marginUsed, scores: scores
        });

        // Status message
        var status   = el('you-status');
        var headline = el('you-headline');
        var sub      = el('you-sub');
        var bpLeft   = excess - targetExcess;
        var maxCanSell = bpLeft > 0 ? bpLeft / MARGIN : 0;
        var roomByExp  = Math.max(0, greenNotional - notional);
        var canSell    = Math.min(maxCanSell, roomByExp);

        status.className = 'you-status ' + zone;

        if (zone === 'danger' && excess < stopExcess) {
            headline.textContent = '🔴 Reduce positions';
            sub.textContent = 'Need ' + fmt(stopExcess - excess) + ' more excess to reach hard stop floor';
        } else if (zone === 'danger') {
            headline.textContent = '🔴 Overexposed';
            sub.textContent = 'Close ' + fmt(notional - orangeNotional) + ' notional to enter caution zone';
        } else if (zone === 'warn' && liqZone === 'warn') {
            headline.textContent = '⚠️ Hold — liquidity low';
            sub.textContent = 'Need ' + fmt(targetExcess - excess) + ' more excess to enter green';
        } else if (zone === 'warn') {
            headline.textContent = '⚠️ Caution — near exposure limit';
            sub.textContent = 'Close ' + fmt(notional - greenNotional) + ' notional to enter green zone';
        } else {
            if (canSell > 100) {
                headline.textContent = '✅ Free to sell';
                sub.textContent = 'Can add ~' + fmt(canSell) + ' more notional (binding: ' + (roomByExp <= maxCanSell ? 'exposure limit' : 'liquidity') + ')';
            } else {
                headline.textContent = '✅ Green — at the limit';
                sub.textContent = 'Little room to add more at current levels';
            }
        }
    }

    // ── AXIS LEGEND TABLE ─────────────────────────────────────────────────
    function renderAxisLegend(d) {
        var fmtE = function(v) { return fmt(v) + ' EUR'; };
        var fmtP = function(v) { return Math.round(v*100) + '%'; };

        var axes = [
            {
                name: 'Liquidity (Excess)',
                score: d.scores[0],
                tgtScore: d.targetScores[0],
                value: fmtE(d.excess),
                optimal: '≥ ' + fmtE(d.targetExcess),
                zones: [
                    { label: '🔴 Danger: < ' + fmtE(d.stopExcess),   color: '#e86060' },
                    { label: '🟡 Warn: ' + fmtE(d.stopExcess) + ' – ' + fmtE(d.targetExcess), color: '#e8a03a' },
                    { label: '🟢 Green: ≥ ' + fmtE(d.targetExcess),  color: '#3aad72' },
                ]
            },
            {
                name: 'VIX Buffer',
                score: d.scores[1],
                tgtScore: d.targetScores[1],
                value: 'VIX ' + d.vix.toFixed(1),
                optimal: 'VIX < 20',
                zones: [
                    { label: '🔴 Danger: VIX ≥ 30',  color: '#e86060' },
                    { label: '🟡 Warn: VIX 20–30',    color: '#e8a03a' },
                    { label: '🟢 Green: VIX < 20',    color: '#3aad72' },
                ]
            },
            {
                name: 'Exposure Safety',
                score: d.scores[2],
                tgtScore: d.targetScores[2],
                value: fmtE(d.notional),
                optimal: '≤ ' + fmtE(d.greenNotional),
                zones: [
                    { label: '🔴 Danger: > ' + fmtE(d.orangeNotional), color: '#e86060' },
                    { label: '🟡 Warn: ' + fmtE(d.greenNotional) + ' – ' + fmtE(d.orangeNotional), color: '#e8a03a' },
                    { label: '🟢 Green: ≤ ' + fmtE(d.greenNotional),   color: '#3aad72' },
                ]
            },
            {
                name: 'Margin Safety',
                score: d.scores[3],
                tgtScore: d.targetScores[3],
                value: fmtE(d.excess),
                optimal: '> ' + fmtE(d.marginUsed + d.stopExcess),
                zones: [
                    { label: '🔴 Danger: Excess < Margin used + Hard stop', color: '#e86060' },
                    { label: '🟢 Green: Excess covers margin + stop floor',  color: '#3aad72' },
                ]
            },
            {
                name: 'Ticker Conc.',
                score: d.scores[4],
                tgtScore: d.targetScores[4],
                value: fmtP(gTickerConc) + ' in top ticker',
                optimal: '< 40% in any ticker',
                rawPct: Math.round(gTickerConc * 100),
                dangerPct: 60,
                zones: [
                    { label: '🔴 Danger: > 60% one ticker', color: '#e86060' },
                    { label: '🟡 Warn: 40–60% one ticker',  color: '#e8a03a' },
                    { label: '🟢 Green: < 40% one ticker',  color: '#3aad72' },
                ]
            },
            {
                name: 'Date Conc.',
                score: d.scores[5],
                tgtScore: d.targetScores[5],
                value: fmtP(gDateConc) + ' one expiry',
                optimal: '< 35% on any date',
                rawPct: Math.round(gDateConc * 100),
                dangerPct: 70,
                zones: [
                    { label: '🔴 Danger: > 70% one date', color: '#e86060' },
                    { label: '🟡 Warn: 35–70% one date',  color: '#e8a03a' },
                    { label: '🟢 Green: < 35% one date',  color: '#3aad72' },
                ]
            },
        ];

        var html = '';
        axes.forEach(function(ax) {
            var sc = ax.score;
            var barColor = sc >= 0.7 ? '#3aad72' : sc >= 0.4 ? '#e8a03a' : '#e86060';
            var valColor = barColor;
            var tgtPct  = Math.round(ax.tgtScore * 100);
            // For concentration axes use the raw % so bar is always visible
            var fillPct = ax.rawPct !== undefined ? Math.min(ax.rawPct, 100) : Math.round(sc * 100);
            // For concentration, target marker = green boundary
            var tgtMarker = ax.rawPct !== undefined
                ? (ax.name.indexOf('Ticker') >= 0 ? 40 : 35)
                : tgtPct;

            html += '<div class="ax-row">';
            html +=   '<span class="ax-name">' + ax.name + '</span>';
            html +=   '<span class="ax-val" style="color:' + valColor + '">' + ax.value + '</span>';
            html +=   '<span class="ax-opt" style="color:var(--muted)">target: ' + ax.optimal + '</span>';
            html +=   '<div class="ax-bar-wrap" style="grid-column:1/-1">';
            html +=     '<div class="ax-bar-fill" style="width:' + fillPct + '%;background:' + barColor + '"></div>';
            html +=     '<div class="ax-bar-tgt" style="left:' + tgtMarker + '%"></div>';
            html +=   '</div>';
            html +=   '<div class="ax-zones">';
            ax.zones.forEach(function(z) {
                html += '<span class="ax-zone-pill" style="background:' + z.color + '18;color:' + z.color + '">' + z.label + '</span>';
            });
            html +=   '</div>';
            html += '</div>';
        });

        el('axis-rows').innerHTML = html;
    }

    // ── WHAT CAN I SELL ───────────────────────────────────────────────────
    function toggleSell() {
        var body  = el('sell-body');
        var arrow = el('sell-arrow');
        var open  = body.style.display === 'block';
        body.style.display  = open ? 'none' : 'block';
        arrow.textContent   = open ? '▸' : '▾';
    }

    function renderSell(d) {
        el('sell-section').style.display = 'block';

        var nlv            = d.nlv;
        var excess         = d.excess;
        var notional       = d.notional;
        var greenNotional  = d.greenNotional;
        var orangeNotional = d.orangeNotional;
        var targetExcess   = d.targetExcess;
        var stopExcess     = d.stopExcess;
        var marginUsed     = d.marginUsed;

        // How much more notional can we add before hitting the binding constraint?
        // Constraint 1: Exposure — room to greenNotional
        var roomExposure = Math.max(0, greenNotional - notional);
        // Constraint 2: Liquidity — each 1 EUR notional uses MARGIN EUR of margin
        var excessAboveTarget = excess - targetExcess;
        var roomLiquidity = excessAboveTarget > 0 ? excessAboveTarget / MARGIN : 0;
        // Constraint 3: Margin — excess must cover margin + stop
        var roomMargin = Math.max(0, (excess - stopExcess) / MARGIN - notional);

        var roomEUR = Math.min(roomExposure, roomLiquidity, roomMargin);
        roomEUR = Math.max(0, roomEUR);

        var bindingLabel = roomExposure <= roomLiquidity && roomExposure <= roomMargin
            ? 'Exposure limit'
            : roomLiquidity <= roomMargin
                ? 'Liquidity — excess near target floor'
                : 'Margin — excess covers margin + stop floor';

        // Blocked tickers — use original USD notional as denominator (not slider)
        var totalUSD = gNotionalUSD > 0 ? gNotionalUSD : 1;
        var blockedTickers = [];
        var blockedDates   = [];
        Object.keys(gTickerMap || {}).forEach(function(t) {
            var pct = gTickerMap[t] / totalUSD;
            if (pct >= 0.25) blockedTickers.push({ name: t, pct: Math.round(pct * 100) });
        });
        blockedTickers.sort(function(a,b){ return b.pct - a.pct; });

        Object.keys(gDateMap || {}).forEach(function(dd) {
            var pct = gDateMap[dd] / totalUSD;
            if (pct >= 0.30) blockedDates.push({ name: dd, pct: Math.round(pct * 100) });
        });
        blockedDates.sort(function(a,b){ return b.pct - a.pct; });

        // Suggest good expiry months (not blocked)
        var blockedDateNames = blockedDates.map(function(d){ return d.name; });
        var suggestions = ['Sep 2026','Dec 2026','Mar 2027'].filter(function(s) {
            return !blockedDateNames.some(function(b){ return b.indexOf(s.split(' ')[0].toUpperCase().slice(0,3)) >= 0; });
        });

        var scores = d.scores;
        var liqPct  = Math.round(scores[0] * 100);
        var expPct  = Math.round(scores[2] * 100);
        var mrgPct  = Math.round(scores[3] * 100);

        function meterColor(s) { return s >= 70 ? '#3aad72' : s >= 40 ? '#e8a03a' : '#e86060'; }

        var blockedTickerHTML = blockedTickers.length
            ? blockedTickers.map(function(t){ return '<span class="sell-tag sell-tag-r">'+t.name+' '+t.pct+'%</span>'; }).join('')
            : '<span class="sell-tag sell-tag-g">No ticker near limit</span>';

        var blockedDateHTML = blockedDates.length
            ? blockedDates.map(function(b){ return '<span class="sell-tag sell-tag-r">'+b.name+' '+b.pct+'%</span>'; }).join('')
            : '<span class="sell-tag sell-tag-g">Dates well spread</span>';

        var suggestHTML = suggestions.length
            ? suggestions.map(function(s){ return '<span class="sell-tag sell-tag-g">'+s+'</span>'; }).join('')
            : '<span class="sell-tag sell-tag-o">Spread across all available months</span>';

        var idealNotional = Math.min(roomEUR, greenNotional * 0.15);

        el('sell-content').innerHTML =
            '<div class="sell-card" style="border-color:rgba(58,173,114,0.3)">' +
                '<div class="sell-headline" style="color:' + (roomEUR > 0 ? '#3aad72' : '#e86060') + '">' +
                    (roomEUR > 0 ? '+' + fmt(roomEUR) + ' EUR notional' : 'No room to add') +
                '</div>' +
                '<div class="sell-sub">' +
                    (roomEUR > 0
                        ? 'You can open new short put positions up to this amount before entering warn zone.'
                        : 'Reduce existing positions before opening new ones.') +
                '</div>' +
                '<div class="sell-constraint">Binding constraint: ' + bindingLabel + '</div>' +
                '<div style="margin-top:10px">' +
                    '<div class="sell-meter-row"><div class="sell-meter-label">Liquidity</div><div class="sell-meter-bar"><div class="sell-meter-fill" style="width:'+liqPct+'%;background:'+meterColor(liqPct)+'"></div></div><div class="sell-meter-val" style="color:'+meterColor(liqPct)+'">'+liqPct+'%</div></div>' +
                    '<div class="sell-meter-row"><div class="sell-meter-label">Exposure</div><div class="sell-meter-bar"><div class="sell-meter-fill" style="width:'+expPct+'%;background:'+meterColor(expPct)+'"></div></div><div class="sell-meter-val" style="color:'+meterColor(expPct)+'">'+expPct+'%</div></div>' +
                    '<div class="sell-meter-row"><div class="sell-meter-label">Margin</div><div class="sell-meter-bar"><div class="sell-meter-fill" style="width:'+mrgPct+'%;background:'+meterColor(mrgPct)+'"></div></div><div class="sell-meter-val" style="color:'+meterColor(mrgPct)+'">'+mrgPct+'%</div></div>' +
                '</div>' +
            '</div>' +
            '<div class="sell-card">' +
                '<div class="sell-rule">' +
                    '<div class="sell-rule-icon" style="background:rgba(232,96,96,0.10)">🚫</div>' +
                    '<div class="sell-rule-text">Avoid these tickers<span class="sell-rule-sub">Getting close to 40% ticker limit</span><div style="margin-top:5px">'+blockedTickerHTML+'</div></div>' +
                '</div>' +
                '<div class="sell-rule">' +
                    '<div class="sell-rule-icon" style="background:rgba(232,96,96,0.10)">📅</div>' +
                    '<div class="sell-rule-text">Avoid these expiry dates<span class="sell-rule-sub">Already concentrated — any new deal here worsens date score</span><div style="margin-top:5px">'+blockedDateHTML+'</div></div>' +
                '</div>' +
                '<div class="sell-rule">' +
                    '<div class="sell-rule-icon" style="background:rgba(58,173,114,0.10)">✅</div>' +
                    '<div class="sell-rule-text">Prefer these expiry months<span class="sell-rule-sub">Spreads date concentration and improves score</span><div style="margin-top:5px">'+suggestHTML+'</div></div>' +
                '</div>' +
                '<div class="sell-rule">' +
                    '<div class="sell-rule-icon" style="background:rgba(58,173,114,0.10)">🎯</div>' +
                    '<div class="sell-rule-text">Ideal next trade<span class="sell-rule-sub">Maximises diversification without breaking other axes</span><div style="margin-top:5px">' +
                        '<span class="sell-tag sell-tag-g">New ticker</span>' +
                        (suggestions[0] ? '<span class="sell-tag sell-tag-g">Exp '+suggestions[0]+'</span>' : '') +
                        '<span class="sell-tag sell-tag-g">Notional &lt; '+fmt(Math.round(idealNotional/1000)*1000)+' EUR</span>' +
                    '</div></div>' +
                '</div>' +
            '</div>';
    }

    // ── IBKR CSV IMPORT ───────────────────────────────────────────────────
    function clearImport() {
        el('import-banner').style.display = 'none';
        el('ibkr-file').value = '';
    }

    function importIBKR(input) {
        var file = input.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
            try {
                parseIBKR(e.target.result);
            } catch(err) {
                showImportBanner('⚠️ Could not parse file: ' + err.message, true);
            }
        };
        reader.readAsText(file);
    }

    function showImportBanner(msg, isError) {
        var banner = el('import-banner');
        banner.style.display = 'flex';
        banner.style.background = isError ? 'rgba(232,96,96,0.08)' : 'rgba(58,173,114,0.08)';
        banner.style.borderColor = isError ? 'rgba(232,96,96,0.25)' : 'rgba(58,173,114,0.25)';
        banner.querySelector('span').textContent = isError ? '⚠️' : '✅';
        el('import-msg').textContent = msg;
    }

    function parseIBKR(csv) {
        var lines = csv.split('\n').map(function(l) { return l.trim(); });

        // 1. NET LIQUIDATION — "Net Asset Value,Data,Total,..."
        //    columns: section,type,asset class,prior,current long,current short,current total,change
        var nlvEUR = null;
        lines.forEach(function(line) {
            if (line.startsWith('Net Asset Value,Data,Total,')) {
                var cols = splitCSV(line);
                // current total = index 6
                var val = parseFloat(cols[6]);
                if (!isNaN(val)) nlvEUR = val;
            }
        });

        // 2. CASH (used as proxy for excess liq)
        //    "Net Asset Value,Data,Cash ,..." current total = index 6
        var cashEUR = null;
        lines.forEach(function(line) {
            if (line.startsWith('Net Asset Value,Data,Cash')) {
                var cols = splitCSV(line);
                var val = parseFloat(cols[6]);
                if (!isNaN(val)) cashEUR = val;
            }
        });

        // 3. OPEN SHORT PUTS — notional = |quantity| * multiplier * strike (USD)
        //    Also track per-ticker and per-date notional for concentration scores
        var notionalUSD = 0;
        var tickerMap = {};  // ticker -> notional
        var dateMap   = {};  // expDate -> notional
        lines.forEach(function(line) {
            if (!line.startsWith('Open Positions,Data,Summary,Equity and Index Options')) return;
            var cols = splitCSV(line);
            var symbol = cols[5] || '';
            var qty    = parseFloat(cols[6]);
            var mult   = parseFloat(cols[7]);
            // Short put: qty < 0 and symbol ends with ' P'
            if (qty < 0 && symbol.trim().endsWith(' P')) {
                var parts  = symbol.trim().split(' ');
                // Format: TICKER DDMMMYY STRIKE P
                var ticker  = parts[0];
                var expDate = parts[1] || 'unknown';
                var strike  = parseFloat(parts[parts.length - 2]);
                if (!isNaN(strike) && !isNaN(mult)) {
                    var n = Math.abs(qty) * mult * strike;
                    notionalUSD += n;
                    tickerMap[ticker] = (tickerMap[ticker] || 0) + n;
                    dateMap[expDate]  = (dateMap[expDate]  || 0) + n;
                }
            }
        });

        // Compute concentration fractions (0=all in one, approaching 1=diversified)
        if (notionalUSD > 0) {
            var maxTicker = Math.max.apply(null, Object.keys(tickerMap).map(function(k){ return tickerMap[k]; }));
            var maxDate   = Math.max.apply(null, Object.keys(dateMap).map(function(k){ return dateMap[k]; }));
            gTickerConc = maxTicker / notionalUSD;
            gDateConc   = maxDate   / notionalUSD;
            gTickerMap  = tickerMap;
            gDateMap    = dateMap;
            gNotionalUSD = notionalUSD;
        } else {
            gTickerConc = 0;
            gDateConc   = 0;
            gTickerMap  = {};
            gDateMap    = {};
        }

        // Apply what we found
        var messages = [];
        var fxRate = getFX();

        if (nlvEUR !== null) {
            el('nlv').value = Math.round(nlvEUR);
            setCur('nlv', 'EUR');
            messages.push('NLV: ' + fmt(nlvEUR) + ' EUR');
        }

        if (cashEUR !== null) {
            el('exc-slider').max = Math.max(el('exc-slider').max, Math.round(nlvEUR || cashEUR));
            el('exc-slider').value = Math.max(0, Math.round(cashEUR));
            setCur('exc', 'EUR');
            messages.push('Excess (cash): ' + fmt(cashEUR) + ' EUR');
        }

        if (notionalUSD > 0) {
            var orangeNotional = EXP[currentMode].o * (nlvEUR || 0);
            el('not-slider').max = Math.max(el('not-slider').max, Math.round(notionalUSD * 1.5));
            el('not-slider').value = Math.round(notionalUSD);
            setCur('not', 'USD');
            // Find biggest ticker and date for display
            var bigTicker = Object.keys(tickerMap).reduce(function(a,b){ return tickerMap[a]>tickerMap[b]?a:b; });
            var bigDate   = Object.keys(dateMap).reduce(function(a,b){ return dateMap[a]>dateMap[b]?a:b; });
            messages.push('Put notional: ' + fmt(notionalUSD) + ' USD');
            messages.push('Top ticker: ' + bigTicker + ' ' + Math.round(gTickerConc*100) + '%');
            messages.push('Top expiry: ' + bigDate + ' ' + Math.round(gDateConc*100) + '%');
        }

        if (messages.length === 0) {
            showImportBanner('No recognisable data found in this file', true);
            return;
        }

        render();
        showImportBanner(messages.join(' · '), false);
    }

    // Simple CSV split that handles quoted fields
    function splitCSV(line) {
        var cols = [], cur = '', inQ = false;
        for (var i = 0; i < line.length; i++) {
            var c = line[i];
            if (c === '"') { inQ = !inQ; }
            else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
            else { cur += c; }
        }
        cols.push(cur.trim());
        return cols;
    }
    // ─────────────────────────────────────────────────────────────────────
    (function loadFX() {
        fetch('tecajna_lista_usd.json')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                // Find the latest date key
                var dates = Object.keys(data).sort();
                var latest = dates[dates.length - 1];
                // Values use comma as decimal separator — replace with dot
                var rate = parseFloat(data[latest].replace(',', '.'));
                if (!isNaN(rate) && rate > 0) {
                    el('fx-rate').value = rate.toFixed(4);
                    // Show date as hint
                    el('fx-date').textContent = latest.slice(5); // MM-DD
                    render();
                }
            })
            .catch(function() {
                // File not found or error — keep default value, no message
            });
    })();

    onVix();
</script>
