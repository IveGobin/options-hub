                '</div>' +
                '<div class="sell-rule">' +
                    '<div class="sell-rule-icon" style="background:rgba(58,173,114,0.10)">🎯</div>' +
                    '<div class="sell-rule-text">Ideal next trade<span class="sell-rule-sub">Maximises diversification without breaking other axes</span><div style="margin-top:5px">' +
                        idealHTML +
                    '</div></div>' +
                '</div>' +
            '</div>';
    }

    // ── IBKR CSV IMPORT ───────────────────────────────────────────────────
    function clearImport() {
        el('import-banner').style.display = 'none';
        el('ibkr-file').value = '';
    }

    function importIBKR(input) {
        var files = Array.from(input.files);
        if (!files.length) return;

        var results = new Array(files.length);
        var done = 0;

        files.forEach(function(file, idx) {
            var reader = new FileReader();
            reader.onload = function(e) {
                results[idx] = e.target.result.replace(/^\uFEFF/, '');
                done++;
                if (done === files.length) {
                    try {
                        var fileNames = files.map(function(f){ return f.name; }).join(' + ');
                        parseIBKRMulti(results, fileNames);
                    } catch(err) {
                        showImportBanner('\u26a0\ufe0f Could not parse file(s): ' + err.message, true);
                    }
                }
            };
            reader.onerror = function() {
                showImportBanner('\u26a0\ufe0f Error reading file: ' + file.name, true);
            };
            reader.readAsText(file);
        });
    }

    // ── PUT RISK MODEL ────────────────────────────────────────────────────
    // The statement has no underlying price, so "how far OTM" is estimated from
    // r = current option price / premium collected:
    //   r <= 0.35  deep OTM   |  r <= 1  OTM  |  r > 1: graded by the loss L (see below)
    // Weight (0.1 .. 1.0) = how much of the raw notional counts as real risk:
    //   - grows with r (more pressure = more risk), reaches 1.0 at r >= 2.5
    //   - a deep OTM put close to expiry is discounted further (little time left to go wrong)
    //   - anything that is not clearly deep OTM gets no time discount (short DTE near strike = gamma risk)
    function putRisk(p) {
        var r = p.ratio;
        if (r === null) return { w: 0.6, status: 'unknown' };
        var m  = 0.15 + 0.85 * Math.min(1, r / 2.5);
        var t0 = 0.6 + 0.4 * Math.min(1, Math.max(0, p.dte) / 45);
        var k  = Math.max(0, Math.min(1, (r - 0.2) / 0.3));   // 0 = clearly deep OTM, 1 = no discount
        var t  = t0 + (1 - t0) * k;
        // Losing puts (r > 1) are graded by the loss L as a share of the strike, the same figure
        // the Put Quality axis uses: < 5% near strike (q > 0.40), 5–10% likely ITM, ≥ 10% deep ITM (q = 0)
        var L = lossShare(p);
        var status = r <= 0.35 ? 'deep' : r <= 1 ? 'otm'
                   : L < NEAR_LOSS ? 'near' : L < DEEP_ITM ? 'itm' : 'ditm';
        return { w: m * t, status: status };
    }
    var RISK_LABEL = { deep: 'Deep OTM', otm: 'OTM', near: 'Near strike', itm: 'Likely ITM', ditm: 'Deep ITM', unknown: 'n/a' };
    var RISK_COLOR = { deep: '#3aad72', otm: 'rgba(58,173,114,0.55)', near: '#e8a03a', itm: '#e86060', ditm: '#b83c3c', unknown: '#7a756d' };

    // ── PUT QUALITY (radar axis) ──────────────────────────────────────────
    // The statement has no underlying prices, so the axis is built from two honest figures:
    //   r = option price / premium                    is the put cheaper or dearer than when sold
    //   L = (option price − premium) / strike         unrealized loss as a share of the notional
    // L never exceeds option price / strike, which bounds the ITM depth from above (intrinsic ≤ price),
    // so a cheap put whose price merely doubled or tripled stays "near strike".
    const NEAR_LOSS = 0.05;   // L < 5%: near strike
    const DEEP_ITM  = 0.10;   // L ≥ 10% of the strike: deep ITM, q = 0
    function lossShare(p) {
        return (p.close > 0 && p.strike > 0) ? Math.max(0, (p.close - p.cost) / p.strike) : 0;
    }
    // q (0..1) per put, continuous:
    //   r ≤ 1 (cheaper than sold):  1 − 0.2·r          → 1.00 … 0.80 (freshly sold)
    //   r > 1 (losing):             0.80·(1 − L/10%)   → 0.80 … 0 (loss ≥ 10% of the strike)
    // Weight in the book average = notional × (1 + L/10%), i.e. up to double for the worst puts.
    function putQuality(p) {
        var r = p.ratio;
        if (r === null) return { q: 0.70, k: 1 };
        if (r <= 1) return { q: 1 - 0.2 * r, k: 1 };
        var x = Math.min(1, lossShare(p) / DEEP_ITM);
        return { q: 0.80 * (1 - x), k: 1 + x };
    }
    // Book score of the imported puts (a what-if is not included). No puts → neutral 0.70.
    function bookQuality() {
        var sw = 0, sq = 0, itm = 0, tot = 0;
        gPositions.forEach(function(p) {
            var pq = putQuality(p), w = p.notional * pq.k;
            sw += w; sq += w * pq.q; tot += p.notional;
            if (p.status === 'itm' || p.status === 'ditm') itm += p.notional;
        });
        return { score: sw > 0 ? sq / sw : 0.70, itmShare: tot > 0 ? itm / tot : 0, n: sw > 0 };
    }

    function escHTML(t) {
        return String(t).replace(/[&<>"']/g, function(c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    // Parse "1,234.56" / "-2" / "" safely (thousands separators are stripped)
    function numIBKR(v) {
        var n = parseFloat(String(v === undefined || v === null ? '' : v).replace(/,/g, ''));
        return isNaN(n) ? NaN : n;
    }

    // Build {lower-case column name -> index} from an IBKR "Header" row
    function ibkrHeaderMap(row) {
        var m = {};
        for (var i = 2; i < row.length; i++) {
            var k = (row[i] || '').trim().toLowerCase();
            if (k && m[k] === undefined) m[k] = i;
        }
        return m;
    }

    // First matching column name wins; fb is used only when the header is missing entirely
    function ibkrCol(map, names, fb) {
        for (var i = 0; i < names.length; i++) {
            if (map[names[i]] !== undefined) return map[names[i]];
        }
        return fb;
    }

    // Parse a single IBKR CSV and return extracted data object.
    // Columns are looked up by their header name in each section, so it works
    // when IBKR adds/removes/reorders columns (e.g. an extra "Account" column).
    function parseIBKRSingle(csv) {
        var out = {
            periodEnd: 0, nlvEUR: null, stockEUR: null, notionalUSD: 0,
            tickerMap: {}, dateMap: {}, positions: [],
            stocks: [], etf: {},
            openPosSeen: false, putsFound: 0
        };
        var MONTHS = { JAN:0, FEB:1, MAR:2, APR:3, MAY:4, JUN:5, JUL:6, AUG:7, SEP:8, OCT:9, NOV:10, DEC:11 };
        var rows = csv.split(/\r?\n/)
            .map(function(l) { return l.trim(); })
            .filter(function(l) { return l.length > 0; })
            .map(splitCSV);

        var headers = {};       // section name -> latest header map (headers can repeat)
        var optRe = /^(.+?)\s+(\d{2})([A-Z]{3})(\d{2})\s+([\d.]+)\s+([CP])$/;

        rows.forEach(function(cols) {
            var sec  = cols[0];
            var kind = cols[1];

            if (kind === 'Header') { headers[sec] = ibkrHeaderMap(cols); return; }
            if (kind !== 'Data') return;

            // Period end date (field name / field value)
            if (sec === 'Statement' && cols[2] === 'Period') {
                var parts = (cols[3] || '').split(' - ');
                var d = new Date(parts[parts.length - 1].trim());
                if (!isNaN(d)) out.periodEnd = d.getTime();
                return;
            }

            // NLV / cash — "Current Total" column of Net Asset Value
            if (sec === 'Net Asset Value') {
                var nm = headers[sec] || {};
                var iTot = ibkrCol(nm, ['current total', 'total'], 6);
                var label = (cols[2] || '').trim();
                var val = numIBKR(cols[iTot]);
                if (isNaN(val)) return;
                if (label === 'Total') out.nlvEUR = val;
                else if (label === 'Stock') out.stockEUR = val;   // market value of all stocks (base currency)
                return;
            }

            // ETFs (already diversified) never count as one-ticker concentration
            if (sec === 'Financial Instrument Information') {
                var fm = headers[sec] || {};
                var iFc = ibkrCol(fm, ['asset category'], 2), iFs = ibkrCol(fm, ['symbol'], 3), iFt = ibkrCol(fm, ['type'], -1);
                if (iFt >= 0 && /^stocks$/i.test(cols[iFc] || '') && /^etf$/i.test((cols[iFt] || '').trim())) {
                    (cols[iFs] || '').split(',').forEach(function(sy) { if (sy.trim()) out.etf[sy.trim()] = true; });
                }
                return;
            }

            // Open short puts notional
            if (sec === 'Open Positions') {
                var m = headers[sec] || {};
                var noHeader = Object.keys(m).length === 0;
                var iDisc = ibkrCol(m, ['datadiscriminator'], 2);
                var iCat  = ibkrCol(m, ['asset category'], 3);
                var iSym  = ibkrCol(m, ['symbol'], 5);
                var iQty  = ibkrCol(m, ['quantity'], 6);
                var iMul  = ibkrCol(m, ['mult', 'multiplier'], 7);
                var iCost = ibkrCol(m, ['cost price'], 8);
                var iClos = ibkrCol(m, ['close price'], 10);
                var iCcy  = ibkrCol(m, ['currency'], 4);
                var iVal  = ibkrCol(m, ['value'], 11);

                // Skip "Lot" detail rows when the statement has a discriminator column
                if ((noHeader || m['datadiscriminator'] !== undefined) && (cols[iDisc] || '') !== 'Summary') return;

                // Stocks held: market value per ticker (in the position's currency) for ticker concentration
                if (/^stocks$/i.test(cols[iCat] || '')) {
                    var sv = numIBKR(cols[iVal]);
                    if (!isNaN(sv) && sv > 0) out.stocks.push({ ticker: (cols[iSym] || '').trim(), ccy: (cols[iCcy] || '').trim(), value: sv });
                    return;
                }
                if (!/option/i.test(cols[iCat] || '')) return;
                out.openPosSeen = true;

                var qty = numIBKR(cols[iQty]);
                var sm  = optRe.exec((cols[iSym] || '').trim());
                if (!sm || sm[6] !== 'P' || isNaN(qty) || qty >= 0) return;

                var mult = numIBKR(cols[iMul]);
                if (isNaN(mult)) mult = 100;
                var strike = parseFloat(sm[5]);
                if (isNaN(strike)) return;

                var ticker  = sm[1].trim();
                var expDate = sm[2] + sm[3] + sm[4];
                var n = Math.abs(qty) * mult * strike;
                out.notionalUSD += n;
                out.putsFound++;
                out.tickerMap[ticker] = (out.tickerMap[ticker] || 0) + n;
                out.dateMap[expDate]  = (out.dateMap[expDate]  || 0) + n;

                var costPx  = Math.abs(numIBKR(cols[iCost]));
                var closePx = Math.abs(numIBKR(cols[iClos]));
                out.positions.push({
                    ticker: ticker, expStr: expDate,
                    expiry: new Date(2000 + parseInt(sm[4], 10), MONTHS[sm[3]], parseInt(sm[2], 10)),
                    strike: strike, qty: Math.abs(qty), notional: n,
                    ratio: (costPx > 0 && !isNaN(closePx)) ? closePx / costPx : null,
                    cost: costPx, close: isNaN(closePx) ? 0 : closePx,
                    dte: 0
                });
            }
        });

        // DTE is measured from the statement date (same moment the option prices are from)
        var ref = out.periodEnd ? new Date(out.periodEnd) : new Date();
        ref.setHours(0, 0, 0, 0);
        out.positions.forEach(function(pos) {
            pos.dte = Math.round((pos.expiry - ref) / 86400000);
            var rk = putRisk(pos);
            pos.w = rk.w; pos.status = rk.status;
        });

        out.stocks.forEach(function(st) { st.etf = !!out.etf[st.ticker]; });
        return out;
    }

    // NLV/cash from newest file, notional summed across all files
    function parseIBKRMulti(csvArray, fileNames) {
        var parsed = csvArray.map(parseIBKRSingle);

        // Sort by period end ascending — newest last
        parsed.sort(function(a, b) { return a.periodEnd - b.periodEnd; });
        var newest = parsed[parsed.length - 1];

        var nlvEUR  = newest.nlvEUR;

        // Open Positions is a snapshot at each statement's period end, so only the NEWEST
        // statement describes what is open now (same as NLV / cash above). Summing the
        // snapshots of several statements would count still-listed or long-closed puts twice.
        var notionalUSD = newest.notionalUSD;
        var tickerMap   = Object.assign({}, newest.tickerMap);
        var dateMap     = Object.assign({}, newest.dateMap);

        gPositions = newest.positions.slice();
        gStmtDate = newest.periodEnd || 0;
        var wSum = 0;
        gPositions.forEach(function(pos) { wSum += pos.w * pos.notional; });
        gRiskAvg = notionalUSD > 0 ? wSum / notionalUSD : null;

        if (notionalUSD > 0) {
            gTickerMap   = tickerMap;
            gDateMap     = dateMap;
            gNotionalUSD = notionalUSD;
        } else {
            gTickerMap = {}; gDateMap = {}; gNotionalUSD = 0;
        }
        gStocks = newest.stocks.slice();   // snapshot of the newest statement, like the puts

        var messages = [];

        if (nlvEUR !== null) {
            el('nlv').value = Math.round(nlvEUR);
            setCur('nlv', 'EUR', true);
            messages.push('NLV: ' + fmt(nlvEUR) + ' EUR');
        }

        if (newest.stockEUR !== null) {
            el('stk-val').value = Math.round(newest.stockEUR);
            setCur('stk', 'EUR', true);
            messages.push('Stocks: ' + fmt(newest.stockEUR) + ' EUR');
        }

        // Excess liquidity is not in the Activity Statement (only in TWS / Client Portal):
        // it stays whatever the user entered and is never overwritten by the import.

        if (notionalUSD > 0) {
            el('not-slider').max = Math.max(el('not-slider').max, Math.round(notionalUSD * 1.5));
            el('not-slider').value = Math.round(notionalUSD);
            setCur('not', 'USD', true);
            var c0 = concNow(0, '', '');
            messages.push('Put notional: ' + fmt(notionalUSD) + ' USD');
            messages.push('Top ticker: ' + c0.topTicker + ' ' + Math.round(c0.tickerConc*100) + '% (stocks + puts)');
            messages.push('Top expiry: ' + c0.topDate + ' ' + Math.round(c0.dateConc*100) + '%');
            var flagged = gPositions.filter(isFlagged).length;
            messages.push('Risk-weighted: ' + Math.round((0.6 + 0.4 * gRiskAvg) * 100) + '% of raw' +
                (flagged ? ' \u00b7 ' + flagged + ' flagged' : ''));
        }

        // Excess is from today (TWS) but the positions are from the statement date
        if (messages.length && gStmtDate) {
            var ageDays = Math.floor((Date.now() - gStmtDate) / 86400000);
            if (ageDays > 3) messages.push('⚠️ Statement is ' + ageDays + ' days old – puts sold since then are in your excess but not in the notional: add them to "Put notional sold"');
        }

        if (messages.length === 0) {
            showImportBanner('No recognisable data found in file(s): ' + (fileNames || 'unknown'), true);
            return;
        }

        if (notionalUSD <= 0) {
            var sawOpen = newest.openPosSeen;
            messages.push('\u26a0\ufe0f No short puts recognised' +
                (sawOpen ? ' (option rows found, but none are short puts)' : ' (no option rows found in Open Positions)') +
                ' \u2013 ticker/date concentration stay at 0%');
        }

        render();
        var prefix = fileNames ? '\ud83d\udcc1 ' + fileNames + ' \u00b7 ' : '';
        showImportBanner(prefix + messages.join(' \u00b7 '), false);
    }

    function showImportBanner(msg, isError) {
        var banner = el('import-banner');
        banner.style.display = 'flex';
        banner.style.background = isError ? 'rgba(232,96,96,0.08)' : 'rgba(58,173,114,0.08)';
        banner.style.borderColor = isError ? 'rgba(232,96,96,0.25)' : 'rgba(58,173,114,0.25)';
        banner.querySelector('span').textContent = isError ? '⚠️' : '✅';
        el('import-msg').textContent = msg;
    }

    // Simple CSV split that handles quoted fields
    function splitCSV(line) {
        var cols = [], cur = '', inQ = false;
        for (var i = 0; i < line.length; i++) {
            var c = line[i];
            if (c === '"') { inQ = !inQ; }
            else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
            else { cur += c; }
        }
        cols.push(cur.trim());
        return cols;
    }
    // ─────────────────────────────────────────────────────────────────────
    (function loadFX() {
        fetch('tecajna_lista_usd.json')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                // Find the latest date key
                var dates = Object.keys(data).sort();
                var latest = dates[dates.length - 1];
                // Values use comma as decimal separator — replace with dot
                var rate = parseFloat(data[latest].replace(',', '.'));
                if (!isNaN(rate) && rate > 0) {
                    el('fx-rate').value = rate.toFixed(4);
                    // Show date as hint
                    el('fx-date').textContent = latest.slice(5); // MM-DD
                    render();
                }
            })
            .catch(function() {
                // File not found or error — keep default value, no message
            });
    })();

    (function loadVIX() {
        fetch('vix_povijest.json')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var dates = Object.keys(data).sort();
                if (!dates.length) return;
                var latest = dates[dates.length - 1];
                var vixVal = parseFloat(data[latest]);
                if (!isNaN(vixVal) && vixVal > 0) {
                    var slider = el('vix-slider');
                    // Clamp to slider range
                    vixVal = Math.max(parseFloat(slider.min), Math.min(parseFloat(slider.max), vixVal));
                    slider.value = vixVal;
                    // Show date next to VIX label
                    var vixLabel = document.querySelector('.vix-label');
                    if (vixLabel) vixLabel.textContent = 'VIX · ' + latest.slice(5).replace('-', '/');
                    onVix();
                }
            })
            .catch(function() {
                // File not found — VIX ostaje na defaultnoj vrijednosti
            });
    })();

    onVix();
</script>
